<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Pins and Zigbee Radio</title>
<meta name="description" content="Proposal for docs/features/34: a Custom pins tab in Advanced tools > Hardware for a person's own plug-in board, and installing the Zigbee module's radio software from the Flasher. Nothing here talks to a board.">
<link rel="icon" href="../../../../tools/flasher/roboflash/web/logo.png">
<!-- The Flasher's own stylesheet, so the mockup looks as the app does and follows it. -->
<link rel="stylesheet" href="../../../../tools/flasher/roboflash/web/app.css">
<!-- Mockup for docs/features/34: custom pins (FLS-029) and the Zigbee radio's software (FLS-030),
     drawn from the plan in custom-pins-and-zigbee-radio-plan.local.md (git-ignored). One file
     with the app's CSS linked; page markup copied from what web/app.js renders today, new pieces
     built from the same classes. Pins are the CrowPanel 7" V1.1's from roboflash/boards.json. No
     motion (FLS-017). Purple is the mockup's own: its bar, its notes and the outline marking what
     is new, never the app. -->
<style>
/* the system theme too (app.css follows only data-theme, which theme.js always sets in the app) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111719; --surface: #172023; --surface-raised: #1c282b; --soft: #151d20; --ink: #f3f7f6;
    --muted: #a5b5b8; --faint: #7d8f93; --line: #2a373b; --line-strong: #3a4b50; --accent: #94eff0;
    --accent-strong: #17bec2; --accent-bg: #17393b; --button-ink: #093335; --amber: #f0cf8f;
    --amber-bg: #2c2517; --red: #ff8a80; --red-bg: #3a1d1b; --red-ink: #2a0d0b; --pcb: #2f7a52;
    --pad: #d8b440; --wire-vcc: #ff7a45; --wire-gnd: #c3d1d4; --wire-data: #5aa2ff;
    --wire-sig: #b69cff; --wire-y: #ffd43b; --wire-g: #69db7c; --wire-p: #f783ac;
  }
}
/* the mockup's own colours */
:root { --mk: #6d4fc7; --mk-bar: #2e2750; --mk-bar-ink: #ece9fb; --mk-bar-soft: #a99ee0; --mk-bar-line: #5b4f96; --mk-tint: rgb(109 79 199 / 7%); }
:root[data-theme="dark"] { --mk: #b9a6ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mk: #b9a6ff; } }

.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 20px; background: var(--mk-bar); color: var(--mk-bar-ink); font-size: 12.5px; }
.mk-bar > b { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #c9bfff; }
.mk-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.mk-group > span { color: var(--mk-bar-soft); margin-right: 4px; }
.mk-bar button { font: inherit; font-size: 12.5px; color: var(--mk-bar-ink); background: transparent; border: 1px solid var(--mk-bar-line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
.mk-bar button:hover { border-color: #c9bfff; }
.mk-bar button[aria-pressed=true] { background: var(--mk-bar-ink); color: var(--mk-bar); border-color: var(--mk-bar-ink); font-weight: 600; }
.mk-states { flex-basis: 100%; }
.mk-note { border: 1.5px dashed var(--mk); background: var(--mk-tint); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink); }
.mk-note::before { content: "Mockup note"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mk); margin-bottom: 2px; }
.mk-note b { color: var(--ink); }
body.no-notes .mk-note { display: none; }
.mk-new { outline: 2px dashed var(--mk); outline-offset: 4px; border-radius: 8px; }
body.no-changes .mk-new { outline: 0; }

/* proposed for app.css: the Hardware tabs, the custom pin tables, the J7 summary */
.tabs { align-self: flex-start; }
.tablewrap { overflow-x: auto; }
table.wires.pins td:first-child { font-weight: 650; white-space: nowrap; }
table.wires.pins td.dir { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
table.wires.pins td.what { color: var(--muted); font-size: 12.5px; }
table.wires.pins tr.fixed td { color: var(--muted); }
table.wires.pins tr.fixed td:first-child { font-weight: 500; }
table.wires.pins select.select { min-width: 200px; }
.j7map { display: grid; grid-template-columns: repeat(12, minmax(52px, 1fr)); gap: 4px; min-width: 640px; }
.j7cell { border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 4px; text-align: center; background: var(--surface); font-family: var(--mono); font-size: 12px; line-height: 1.25; }
.j7cell small { display: block; font-family: var(--font); font-size: 11px; color: var(--muted); min-height: 14px; overflow-wrap: anywhere; }
.j7cell.p5 { background: var(--amber-bg); color: var(--amber); font-weight: 700; }
.j7cell.p3 { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
.j7cell.gnd { background: var(--surface-raised); }
.j7cell.off { opacity: .45; }
.j7cell.used { border: 2px solid var(--accent); font-weight: 700; }
.j7cell.used small { color: var(--accent); font-weight: 600; }
.j7cell.zone { border-style: dashed; }
.j7cell { position: relative; }
.j7wrap { padding: 8px 2px 2px 6px; }
.j7cell .num-badge { position: absolute; top: -7px; left: -5px; min-width: 16px; height: 16px; font-size: 10px; margin: 0; }
.why-inline { font-size: 13px; color: var(--red); }
.card > h2 + p, .card > h2 + .need { margin-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.radio-art { max-width: 460px; }

/* phone width: the real app is a desktop window; the mockup still reads on a phone */
@media (max-width: 700px) {
  .appbar { flex-wrap: wrap; padding: 8px 16px; min-height: 0; }
  .shell { flex-direction: column; }
  .rail { display: none; }
  .page { padding: 20px 16px; }
  .actions { padding: 12px 16px; flex-wrap: wrap; }
  .mk-bar { padding: 8px 16px; }
  .part-head, .test-head { grid-template-columns: 44px 1fr; }
  .part-head > :last-child, .test-head > :last-child { grid-column: 1 / -1; }
  .choices, .subpick .choices { grid-template-columns: 1fr; }
  .list-row { grid-template-columns: 34px 1fr; }
  .list-row .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
  dl.facts { grid-template-columns: 1fr; }
  h1 { font-size: 25px; }
}
</style>
</head>
<body>
<div class="mk-bar" id="mk-bar" role="toolbar" aria-label="Mockup controls"></div>
<header class="appbar">
  <div class="wordmark"><img src="../../../../tools/flasher/roboflash/web/logo.png" alt=""><b>RoboAlarms</b><span>Flasher</span></div>

    <button id="mode-guided" type="button" data-mk="mode" data-v="guided">Guided setup</button>

<div id="app" class="shell"></div>
<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Apply these pins and restart the panel?</h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" type="button" id="modal-cancel">Cancel</button>
      <button class="btn primary" type="button" id="modal-ok">Apply and restart</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ---- helpers, as web/app.js has them ---------------------------------------------------------- */
function h(tag, attrs, ...kids) { const el = document.createElement(tag); setAttrs(el, attrs); append(el, kids); return el; }
const SVGNS = 'http://www.w3.org/2000/svg';

function setAttrs(el, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {

}

}
const $ = (id) => document.getElementById(id);
const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

/* Lucide icons (ISC licence), the app's set */
const ICONS = {
  usb: '<circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3 19 5"/><path d="m21 3-3 1 2 2Z"/><path d="M9.26 7.68 5 12l2 5"/><path d="m10 14 5 2 3.5-3.5"/><path d="m18 12 1-1 1 1-1 1Z"/>',
  cpu: '<path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/>',
  radio: '<path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6h4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  circleCheck: '<circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/>',
  triangle: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  sliders: '<path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  terminal: '<path d="M12 19h8"/><path d="m4 17 6-6-6-6"/>',
  download: '<path d="M12 2v8"/><path d="m16 6-4 4-4-4"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 18h.01"/><path d="M10 18h.01"/>',
  plug: '<path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  folder: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  siren: '<path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/>',
  right: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  left: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/>',
  archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  tower: '<path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
  power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
};
function icon(name) {
  const t = document.createElement('template');
  t.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  return t.content.firstChild;
}
const note = (kind, ic, lead, text) => h('div', { class: 'note ' + kind }, icon(ic), h('div', {}, lead ? h('b', { text: lead + ' ' }) : null, text));
const mk = (...kids) => h('div', { class: 'mk-note' }, ...kids);
const chip = (kind, ic, text) => h('span', { class: 'chip ' + kind }, ic ? icon(ic) : null, text);

/* ---- the board: the CrowPanel 7" V1.1 (boards.json) ------------------------------------------- */
const J7 = [['5V', '5V', '5V', 'GND', 'GND', 'IO52', 'IO51', 'IO50', 'IO49', 'IO28', 'GND', 'GND'],
  ['3V3', '3V3', '3V3', 'GND', 'IO2', 'IO3', 'IO4', 'IO5', 'IO25', 'IO27', 'GND', 'GND']];
const REACH = [2, 3, 4, 5, 27, 28, 49, 50, 51, 52];      // J7's IO pins a custom board may use (25 is USB)
const TERMINALS = [2, 3, 4, 5, 49, 50, 51, 52];          // the wired-zone terminals among them
// Zones wired to a terminal today (the panel's `terminals`), an example. The hardware layout
// overrides them: they are never offered or refused in the pin lists, only named in the
// confirmation, because a zone whose terminal is taken shows Check after the restart (ZSRC-010).
const ZONES = { 4: { n: 3, name: 'Back door' } };

const MODS = {
  cc1101: { name: 'CC1101 board', short: 'CC1101', icon: 'radio', signals: [
    { k: 'mosi', pin: 'SI (MOSI)', dir: 'Panel → CC1101', what: 'Data into the CC1101' },
    { k: 'miso', pin: 'SO (MISO)', dir: 'CC1101 → panel', what: 'Data out of the CC1101' },
    { k: 'sck', pin: 'SCLK', dir: 'Panel → CC1101', what: 'The clock the panel sends' },
    { k: 'cs', pin: 'CSn', dir: 'Panel → CC1101', what: 'Selects the CC1101' },
    { k: 'gdo0', pin: 'GDO0', dir: 'CC1101 → panel', what: 'What it hears' }],
    fixed: [['GDO2', 'Not connected'], ['VCC', 'Any 3V3 pin, never 5V. It may share one with other modules.'], ['GND', 'Any GND pin. It may share one too.']] },
  module: { name: 'Receiver module', short: 'Receiver', icon: 'radio', signals: [
    { k: 'data', pin: 'DATA', dir: 'Receiver → panel', what: 'What it hears' }],
    fixed: [['VCC', 'Any 3V3 pin, never 5V: DATA would carry 5 V into the panel.'], ['GND', 'Any GND pin. It may share one with other modules.']] },
  zwave: { name: 'Z-Wave radio (ZAC93)', short: 'Z-Wave', icon: 'radio', signals: [
    { k: 'rx', pin: 'RX (position 8)', dir: 'Panel → radio', what: 'Takes what the panel sends' },
    { k: 'tx', pin: 'TX (position 10)', dir: 'Radio → panel', what: 'What the radio sends' },
    { k: 'reset', pin: 'RESET (position 7)', dir: 'Panel → radio', what: 'Optional: lets the panel restart the radio. Boards etched Version 2.0.', optional: true }],
    fixed: [['Position 1 (VCC)', 'Any 3V3 pin, never 5V.'], ['Position 6 (GND)', 'Any GND pin.'], ['Positions 2 and 4', 'Not connected: 5 V on a Raspberry Pi.']] },
  clock: { name: 'Battery-backed clock (DS3231)', short: 'Clock', icon: 'clock', signals: [
    { k: 'sda', pin: 'SDA', dir: 'Both ways', what: 'Data' },
    { k: 'scl', pin: 'SCL', dir: 'Panel → clock', what: 'The clock the panel sends' }],
    fixed: [['SQW, 32K', 'Not connected'], ['VCC', 'Any 3V3 pin, never 5V.'], ['GND', 'Any GND pin.']] },
};

/* ---- the mockup's state ------------------------------------------------------------------------ */
// A pin is null (not chosen yet), 'nc' (not connected: optional pins only) or a GPIO number.
const BLANK_PINS = () => ({ cc1101: { mosi: null, miso: null, sck: null, cs: null, gdo0: null }, module: { data: null },
  zwave: { rx: null, tx: null, reset: null }, clock: { sda: null, scl: null } });
// what a panel that already has custom pins reports, an example
const PANEL_PINS = () => ({ cc1101: { mosi: 51, miso: 50, sck: 52, cs: 49, gdo0: 5 }, module: { data: null },
  zwave: { rx: 27, tx: 28, reset: 'nc' }, clock: { sda: 2, scl: 3 } });
const copyPins = (p) => JSON.parse(JSON.stringify(p));
const M = {
  mode: 'tools', screen: 'custom', notes: true, changes: true,
  custom: 'first',      // first (suggested places) | fromPanel | newpanel (no RoboAlarms) | oldfw | applied
  how: 'apply',         // how the pins went on: apply | install | update
  panel: null,          // the custom layout the panel stores ({pins, clockPlace}), or null
  cleared: false,       // the pins read from the panel were reset
  radio: 'found',       // none | seen | found | installing | done | uptodate
  test: 'working',      // working | notheard
  parts: 'new',         // new | custom
  // the parts the panel has now; the pins are this tab's draft, kept while the Flasher is open
  rf: 'cc1101', zwave: true, clock: true, zigbee: true, clockPlace: null,
  pins: BLANK_PINS(),
  ticks: { v11: false, vcc: false },
  alone: false, keepCopy: false,   // the module's copy: off until ticked
};
function setCustom(v) {   // the mockup's State buttons for the Custom pins tab
  M.custom = v; M.cleared = false;
  if (v === 'first' || v === 'oldfw' || v === 'newpanel') { M.panel = null; M.pins = BLANK_PINS(); M.clockPlace = null; return; }
  if (v === 'applied') M.how = 'apply';
  if (v === 'applied' && !problems().length) { M.panel = { pins: copyPins(M.pins), clockPlace: M.clockPlace }; return; }
  M.panel = { pins: PANEL_PINS(), clockPlace: 'j7' };
  M.pins = copyPins(M.panel.pins); M.clockPlace = M.panel.clockPlace;
}
const SCREENS = {
  tools: [['custom', 'Hardware › Custom pins'], ['places', 'Hardware › Suggested places'], ['zbtool', 'Zigbee module'], ['software', 'Software'], ['ports', 'Panels and ports']],
  guided: [['parts', 'Panel and parts'], ['ready', 'Get ready'], ['zigbee', 'Prepare the Zigbee module'], ['test', 'Test and finish']],
};
const STATES = {
  custom: ['custom', [['first', 'First time (all blank)'], ['fromPanel', 'Read from the panel'], ['newpanel', 'New panel (no RoboAlarms)'], ['oldfw', 'Older RoboAlarms'], ['applied', 'Applied']]],
  places: ['custom', [['first', 'Panel on suggested places'], ['fromPanel', 'Panel with custom pins'], ['newpanel', 'New panel (no RoboAlarms)']]],
  zbtool: ['radio', [['none', 'No module'], ['seen', 'Plugged in'], ['found', 'Checked'], ['installing', 'Installing'], ['done', 'Done'], ['uptodate', 'Already has it']]],
  ports: ['radio', [['none', 'No module'], ['seen', 'Plugged in'], ['found', 'Checked']]],
  parts: ['parts', [['new', 'New panel'], ['custom', 'Panel with custom pins']]],
  ready: ['radio', [['none', 'Not done yet'], ['done', 'Done']]],
  zigbee: ['radio', [['none', 'Plug it in'], ['seen', 'Plugged in'], ['found', 'Checked'], ['installing', 'Installing'], ['done', 'Done'], ['uptodate', 'Already has it']]],
  test: ['test', [['working', 'Zigbee working'], ['notheard', 'Zigbee not heard']]],
};

/* ---- the custom layout: who uses which pin ----------------------------------------------------- */
function active() {
  const a = [];
  if (M.rf !== 'none') a.push(M.rf);
  if (M.zwave) a.push('zwave');
  if (M.clock && M.clockPlace === 'j7') a.push('clock');
  return a;
}
function badgeNo(mod) {   // the number each module carries on the J7 summary and its card
  const order = []; if (M.rf !== 'none') order.push(M.rf); if (M.zwave) order.push('zwave'); if (M.clock) order.push('clock');
  return order.indexOf(mod) + 1;
}
function uses() {         // gpio -> [{mod, sig}]
  const u = {};
  for (const mod of active()) for (const sg of MODS[mod].signals) {
    const g = M.pins[mod][sg.k];
    if (typeof g !== 'number') continue;
    (u[g] = u[g] || []).push({ mod, sig: sg });
  }
  return u;
}
function whoElse(g, mod, k) {   // only the modules on this tab: zones never block a pin here
  const u = (uses()[g] || []).filter((x) => !(x.mod === mod && x.sig.k === k));
  return u.length ? `used by ${MODS[u[0].mod].short} ${u[0].sig.pin}` : '';
}
function problems() {
  const out = [];
  let missing = 0;
  for (const mod of active()) for (const sg of MODS[mod].signals) if (M.pins[mod][sg.k] === null) missing++;
  if (missing) out.push(`${missing} pin${missing > 1 ? 's' : ''} still to choose.`);
  if (M.clock && !M.clockPlace) out.push('The clock: choose where it is wired.');
  for (const [g, list] of Object.entries(uses())) {
    if (list.length > 1) out.push(`IO${g} is chosen twice: ${list.map((x) => MODS[x.mod].short + ' ' + x.sig.pin).join(' and ')}.`);
  }
  return out;
}
function zonesMoved() {   // zones wired to a terminal the new layout takes
  if (M.custom === 'newpanel') return [];   // a new panel has no zones yet
  const u = uses();
  return Object.keys(ZONES).filter((g) => u[g]).map((g) => ({ g, ...ZONES[g] }));

    kids.push(eyebrow('Step 2 of 8 · Wire · Zigbee module'),
      h('div', { class: 'success' }, h('span', { class: 'big-check' }, icon('check')), h('div', {}, h('h1', { id: 'page-title', tabindex: -1, text: 'The Zigbee module is ready' }), h('p', { class: 'lead', text: 'RoboAlarms radio 1.0.0, written and checked.' }))),
      h('div', { class: 'card' }, h('h2', { text: 'Now' }), h('ol', { class: 'todo' }, h('li', { text: 'Unplug its USB cable.' }), h('li', { text: 'Put it aside. Full wiring shows where it goes, with the panel switched off.' }))));
    primary = h('button', { class: 'btn primary', type: 'button', 'data-mk': 'goto', 'data-v': 'ready' }, 'Back to Get ready', icon('right'));
  }
  kids.push(mk(h('b', { text: 'Decision 3: out of the panel only. ' }), 'The tick is required before the Flasher touches the port. The job: look, keep a copy (only if ticked: off by default), erase, write, check, restart; then "unplug its cable", which also clears a module left in its loader. The panel confirms it on Test and finish.'));
  return page(kids, footer(h('button', { class: 'btn ghost', type: 'button', 'data-mk': 'goto', 'data-v': 'ready' }, icon('left'), 'Back'), h('span', { class: 'spacer' }),
    st === 'installing' || st === 'done' || st === 'uptodate' ? null : h('button', { class: 'btn ghost', type: 'button', 'data-mk': 'goto', 'data-v': 'ready', title: 'Leave the module out of the panel until it has its software.' }, 'Do this later'),
    primary));
}
function gTest() {
  const ok = M.test === 'working';
  return page([eyebrow('Step 8 of 8 · Install'),
    h('div', { class: 'success' }, h('span', { class: 'big-check' }, icon('check')), h('div', {}, h('h1', { id: 'page-title', tabindex: -1, text: 'RoboAlarms is running on your panel' }), h('p', { class: 'lead', text: 'Finish on the touchscreen, then test your parts here.' }))),
    h('h2', { class: 'section', text: 'Test your parts' }),
    h('section', { class: 'card test' }, h('div', { class: 'test-head' }, h('span', { class: 'icon-tile' }, icon('radio')), h('div', {}, h('h2', { text: 'Wireless sensors' }), h('p', { class: 'muted small', text: 'CC1101 on J7' })), chip('good', 'check', 'Working'))),
    h('section', { class: 'card test' }, h('div', { class: 'test-head' }, h('span', { class: 'icon-tile' }, icon('clock')), h('div', {}, h('h2', { text: 'Battery-backed clock' }), h('p', { class: 'muted small', text: '24.3 °C · Time from the clock module' })), chip('good', 'check', 'Keeping time'))),
    ok ? h('section', { class: 'card test mk-new' }, h('div', { class: 'test-head' }, h('span', { class: 'icon-tile' }, icon('tower')), h('div', {}, h('h2', { text: 'Zigbee radio' }), h('p', { class: 'muted small', text: 'In the socket · ready on channel 11' })), chip('good', 'check', 'Working')),
      h('p', {}, 'The panel hears the Zigbee module. Add Zigbee sensors on the touchscreen: Settings › Devices › Zigbee.'),
      h('details', { class: 'more' }, h('summary', {}, icon('info'), 'Radio software'), h('dl', { class: 'facts' }, h('dt', { text: 'Reported' }), h('dd', { text: 'openthread-esp32/fff9895c-b678a4f; esp32h2; 2026-10-04' }))))
      : h('section', { class: 'card test mk-new' }, h('div', { class: 'test-head' }, h('span', { class: 'icon-tile plain' }, icon('tower')), h('div', {}, h('h2', { text: 'Zigbee radio' }), h('p', { class: 'muted small', text: 'In the socket' })), chip('warn', 'triangle', 'Not heard')),
        h('p', {}, 'The panel doesn\'t hear the Zigbee module. With the panel switched off, check it sits fully in its socket. If it does, it may still need its radio software: Advanced tools › Zigbee module.'),

    h('section', { class: 'card test' }, h('div', { class: 'test-head' }, h('span', { class: 'icon-tile' }, icon('radio')), h('div', {}, h('h2', { text: 'Z-Wave radio' }), h('p', { class: 'muted small', text: 'On J7 · its radio answered' })), chip('good', 'check', 'Working'))),
    mk('The Zigbee card reads the panel\'s "zigbee status" and waits a little for the radio after the restart, as the Z-Wave card does. "Not heard" can mean an empty socket, the demo software or a module stuck in its loader: the panel can\'t tell these apart, so the words name both checks. The version is shown for information only.')],
  footer(h('span', { class: 'spacer' }), h('button', { class: 'btn primary', type: 'button' }, 'Finish')));
}

/* ---- render and events ------------------------------------------------------------------------- */
const VIEWS = { custom: toolCustom, places: toolPlaces, zbtool: toolZigbee, software: toolSoftware, ports: toolPorts, parts: gParts, ready: gReady, zigbee: gZigbee, test: gTest };
const GUIDED_STEP = { parts: 0, ready: 1, zigbee: 1, test: 7 };
const TOOL_OF = { custom: 'hardware', places: 'hardware', zbtool: 'zigbee', software: 'software', ports: 'ports' };
function mkBar() {
  const bar = clear($('mk-bar'));
  const btn = (act, v, t, on) => h('button', { type: 'button', 'data-mk': act, 'data-v': v, 'aria-pressed': String(!!on) }, t);
  const st = STATES[M.screen];
  append(bar, [h('b', { text: 'Proposal · Flasher' }),
    h('div', { class: 'mk-group' }, h('span', { text: 'Advanced tools' }), SCREENS.tools.map(([k, t]) => btn('screen', k, t, M.screen === k))),
    h('div', { class: 'mk-group' }, h('span', { text: 'Guided setup' }), SCREENS.guided.map(([k, t]) => btn('screen', k, t, M.screen === k))),
    h('div', { class: 'mk-group' }, btn('notes', '', 'Notes', M.notes), btn('changes', '', 'Mark what is new', M.changes)),
    st ? h('div', { class: 'mk-group mk-states' }, h('span', { text: 'State' }), st[1].map(([k, t]) => btn('state', k, t, M[st[0]] === k))) : null]);
}
function render() {
  M.mode = GUIDED_STEP[M.screen] !== undefined ? 'guided' : 'tools';
  document.body.classList.toggle('no-notes', !M.notes);
  document.body.classList.toggle('no-changes', !M.changes);
  $('mode-guided').setAttribute('aria-pressed', String(M.mode === 'guided'));
  $('mode-tools').setAttribute('aria-pressed', String(M.mode === 'tools'));
  mkBar();
  const keep = $('page') ? $('page').scrollTop : 0;
  const app = clear($('app'));
  append(app, [M.mode === 'guided' ? railGuided(GUIDED_STEP[M.screen]) : railTools(TOOL_OF[M.screen]), VIEWS[M.screen]()]);
  $('page').scrollTop = keep;
  // determinate bars: widths are classes, as in the app (no inline styles)
  document.querySelectorAll('.bar > i.w62').forEach((i) => { i.style.width = '62%'; });
}
function go(screen) { M.screen = screen; render(); const p = $('page'); if (p) p.scrollTop = 0; }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-mk]');
  if (!t || t.disabled) return;
  const v = t.dataset.v;
  switch (t.dataset.mk) {
    case 'screen': case 'goto': go(v); return;
    case 'mode': go(v === 'guided' ? 'parts' : 'custom'); return;
    case 'tool': go({ hardware: 'custom', zigbee: 'zbtool', software: 'software', ports: 'ports' }[v] || M.screen); return;
    case 'state': { const st = STATES[M.screen]; if (st && st[0] === 'custom') setCustom(v); else if (st) M[st[0]] = v;
      if (st && st[0] === 'radio' && v === 'seen') M.alone = false; render(); return; }
    case 'changepins': M.custom = 'fromPanel'; M.cleared = false; render(); return;
    case 'resetpins': M.pins = BLANK_PINS(); M.clockPlace = null; M.cleared = true; render(); return;
    case 'reread': M.cleared = false;
      if (M.panel) { M.pins = copyPins(M.panel.pins); M.clockPlace = M.panel.clockPlace; } else { M.pins = BLANK_PINS(); M.clockPlace = null; }
      render(); return;
    case 'notes': M.notes = !M.notes; render(); return;
    case 'changes': M.changes = !M.changes; render(); return;
    case 'part': if (v === 'rf') M.rf = M.rf === 'none' ? 'cc1101' : 'none'; else M[v] = !M[v]; render(); return;
    case 'rfkind': M.rf = v; render(); return;
    case 'clockplace': M.clockPlace = v; render(); return;
    case 'apply': openApply(); return;
    default:
  }
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-mk]');
  if (!t) return;
  if (t.dataset.mk === 'pin') { M.pins[t.dataset.mod][t.dataset.sig] = t.value === '' ? null : t.value === 'nc' ? 'nc' : Number(t.value); render(); const again = $(t.id); if (again) again.focus(); }
  else if (t.dataset.mk === 'tick') { M.ticks[t.dataset.v] = t.checked; render(); }
  else if (t.dataset.mk === 'alone') { M.alone = t.checked; render(); }
  else if (t.dataset.mk === 'keep') { M.keepCopy = t.checked; render(); }
});
function openApply() {
  const body = clear($('modal-body'));
  const list = [];
  for (const mod of active()) for (const sg of MODS[mod].signals) { const g = M.pins[mod][sg.k]; list.push(h('li', { text: `${MODS[mod].short} ${sg.pin}: ${typeof g === 'number' ? 'IO' + g : 'not connected'}` })); }
  if (M.clock && M.clockPlace === 'j13') list.push(h('li', { text: 'Clock: on the I2C connector (J13)' }));
  const moved = zonesMoved();
  const kind = M.custom === 'newpanel' ? 'install' : M.custom === 'oldfw' ? 'update' : 'apply';
  $('modal-title').textContent = { apply: 'Apply these pins and restart the panel?', install: 'Install RoboAlarms with these pins?', update: 'Update to 0.7.0 with these pins?' }[kind];
  $('modal-ok').textContent = { apply: 'Apply and restart', install: 'Install', update: 'Update' }[kind];
  $('modal-ok').dataset.kind = kind;
  const what = {
    apply: 'The panel checks the pins, stores them and restarts once. ',
    install: 'The Flasher keeps a copy of what is on the board now, installs RoboAlarms 0.7.0, starts it, sets these pins and restarts it once more: about 5 minutes. ',
    update: 'The Flasher updates the panel to 0.7.0 (its codes, zones and settings stay), then sets these pins and restarts it once more: about 3 minutes. ',
  }[kind];
  append(body, [h('p', {}, what, h('strong', { text: 'Your board stays unplugged until the end.' })), h('ul', { class: 'tight' }, list),
    moved.map((z) => h('p', { class: 'small' }, h('b', { text: `Zone ${z.n} (${z.name}) is wired to IO${z.g} today. ` }), 'Your board takes that pin: after the restart the zone shows Check until you give it another terminal or remove it.'))]);
  $('modal').hidden = false; $('modal-ok').focus();
}
$('modal-cancel').addEventListener('click', () => { $('modal').hidden = true; });
$('modal-ok').addEventListener('click', () => { $('modal').hidden = true; M.how = $('modal-ok').dataset.kind || 'apply'; M.panel = { pins: copyPins(M.pins), clockPlace: M.clockPlace }; M.custom = 'applied'; M.cleared = false; render(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').hidden = true; });

/* the theme: the viewer's own (data-theme or the system), and the app's toggle */
$('theme-toggle').append(icon('sun'));
$('theme-toggle').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});

/* a bare #token opens a screen: #custom, #places, #software, #ports, #parts, #ready, #zigbee, #test */
const start = location.hash.slice(1);
if (VIEWS[start]) M.screen = start;
render();
</script>
