<!-- Prototype for docs/research/FlasherUXResearch.md. One file, no external assets, no
     motion (FLS-017). Icons: Lucide (ISC), the set the touchscreen UI already uses. Pins and
     wiring are the CrowPanel 7"'s (tools/flasher/roboflash/boards.json, board_pins.h). -->
<style>
/* The website's tokens ("At home") and the docs' accent
 * (src/styles/custom.css in RoboAlarms/documentation, docs/BRAND.md): teal #007b7d on light, #94eff0 on dark, the
 * Segoe UI system stack, 7px buttons, 4px tags, 12px cards. Added for an app: --amber-bg and
 * a red for errors (the site has neither), wire colours, and the panel frame from .panel-frame. */
:root, :root[data-theme='light'] {
  color-scheme: light;
  --bg: #f7faf9;
  --surface: #ffffff;
  --surface-raised: #edf3f2;
  --soft: #eef4f2;
  --ink: #142b30;
  --muted: #536970;
  --faint: #7a8e92;
  --line: #d3dfdd;
  --line-strong: #b9cac7;
  --accent: #007b7d;
  --accent-strong: #006668;
  --accent-bg: #e0f3ef;
  --button-ink: #ffffff;
  --amber: #865914;
  --amber-bg: #fbf1de;
  --red: #b3261e;
  --red-bg: #fdecea;
  --panel-frame: #070e11;
  --panel-edge: #34464a;
  --panel-screen: #0f2428;
  --mark: #94eff0;
  --pcb: #2b6e4a;
  --pcb-ink: #e3f5ea;
  --pad: #c9a227;
  --wire-vcc: #d9480f;
  --wire-gnd: #142b30;
  --wire-data: #1c6fd6;
  --wire-sig: #7b4fc9;
  --wire-y: #c99400;
  --wire-g: #2b8a3e;
  --wire-p: #c2255c;
  --radius: 12px;
  --shadow: none;
  --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #111719;
  --surface: #172023;
  --surface-raised: #1c282b;
  --soft: #151d20;
  --ink: #f3f7f6;
  --muted: #a5b5b8;
  --faint: #7d8f93;
  --line: #2a373b;
  --line-strong: #3a4b50;
  --accent: #94eff0;
  --accent-strong: #17bec2;
  --accent-bg: #17393b;
  --button-ink: #093335;
  --amber: #f0cf8f;
  --amber-bg: #2c2517;
  --red: #ff8a80;
  --red-bg: #3a1d1b;
  --pcb: #2f7a52;
  --pad: #d8b440;
  --wire-vcc: #ff7a45;
  --wire-gnd: #c3d1d4;
  --wire-data: #5aa2ff;
  --wire-sig: #b69cff;
  --wire-y: #ffd43b;
  --wire-g: #69db7c;
  --wire-p: #f783ac;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  font: 15px/1.6 var(--font);
  color: var(--ink);
  background: var(--bg);
}
::selection { background: var(--accent); color: var(--bg); }
h1, h2, h3, p, ol, ul, dl { margin: 0; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.ic { width: 18px; height: 18px; flex-shrink: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* prototype strip (the website's .announcement and .preview-label): not part of the design */
.proto {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 7px 20px; font-size: 13px; line-height: 1.4; color: var(--muted);
  background: var(--soft); border-bottom: 1px solid var(--line);
}
.preview-label { font-size: 12px; letter-spacing: .03em; color: var(--accent); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
.proto .grow { flex: 1; min-width: 200px; }
.proto select, .proto button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 5px; padding: 3px 8px; cursor: pointer;
}

/* app bar (the website's header and wordmark) */
.appbar {
  display: flex; align-items: center; gap: 16px; padding: 10px 20px; min-height: 64px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.wordmark { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.wordmark img { width: 32px; height: 32px; object-fit: contain; }
.wordmark b { font-size: 21px; font-weight: 750; letter-spacing: -.055em; }
.wordmark span { color: var(--muted); font-size: 15px; padding-left: 12px; border-left: 1px solid var(--line); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); }
.seg button {
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted);
  border: 0; border-radius: 5px; background: transparent; padding: 6px 12px; cursor: pointer;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--accent-bg); color: var(--accent); }
.theme-toggle { background: transparent; border: 0; display: grid; place-content: center; width: 40px; height: 40px; border-radius: 50%; color: var(--muted); cursor: pointer; }
.theme-toggle:hover { background: var(--surface-raised); color: var(--ink); }
.theme-toggle svg { width: 20px; height: 20px; }

/* shell */
.shell { flex: 1; display: flex; min-height: 0; }
.rail {
  width: 272px; flex-shrink: 0; padding: 26px 16px 20px; overflow-y: auto;
  background: var(--soft); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
}
.steps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.step {
  width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  padding: 10px; border-radius: 12px; border: 1px solid transparent; background: none;
  font: inherit; color: inherit; text-align: left;
}
button.step { cursor: pointer; }
button.step:hover { background: var(--surface); border-color: var(--line); }
.step .num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 650; color: var(--faint);
  border: 1.5px solid var(--line-strong); background: var(--surface);
}
.step .num .ic { width: 16px; height: 16px; stroke-width: 3; }
.step b { display: block; font-weight: 600; line-height: 28px; }
.step small { display: block; margin-top: -3px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.step.done .num { background: var(--accent); border-color: var(--accent); color: var(--button-ink); }
.step.current { background: var(--accent-bg); }
.step.current b { color: var(--accent); }
.step.current .num { border: 2px solid var(--accent); color: var(--accent); background: transparent; }
.step.todo b { color: var(--muted); font-weight: 500; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 10px; }
.fw { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.fw .ic { color: var(--accent); }
.fw small { display: block; color: var(--muted); font-size: 12px; }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.page { flex: 1; overflow-y: auto; padding: 36px 48px 32px; }
.inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.inner.wide { max-width: 900px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 650; letter-spacing: .145em; text-transform: uppercase; color: var(--accent); margin-bottom: -8px; }
.eyebrow::before { content: ""; width: 25px; height: 2px; background: var(--accent); }
h1 { font-size: 30px; line-height: 1.13; font-weight: 650; letter-spacing: -.035em; outline: none; }
h2 { font-size: 16.5px; font-weight: 650; letter-spacing: -.02em; }
h2.section { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -6px; }
.lead { font-size: 15.5px; line-height: 1.55; color: var(--muted); max-width: 64ch; margin-top: -8px; }

.actions {
  display: flex; align-items: center; gap: 10px; padding: 14px 48px;
  background: var(--surface); border-top: 1px solid var(--line);
}
.spacer { flex: 1; }

/* buttons */
.btn {
  font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
.btn:hover:not(:disabled) { background: var(--surface); border-color: var(--muted); }
.btn.primary { min-height: 46px; padding: 11px 21px; font-size: 15px; background: var(--accent); border-color: var(--accent); color: var(--button-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-raised); color: var(--ink); }
.btn.small { min-height: 32px; padding: 5px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link {
  font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-align: left;
}
.link:hover { text-decoration: underline; }
.link .ic { width: 16px; height: 16px; }

/* cards, notes, chips */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.note { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 14px; border-radius: 7px; font-size: 14px; line-height: 1.55; }
.note .ic { width: 20px; height: 20px; margin-top: 0; }
.note.warn { background: var(--amber-bg); color: var(--amber); }
.note.info { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.note.info .ic { color: var(--accent); }
.note.good { background: var(--accent-bg); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 4px;
  font-size: 12px; line-height: 1.4; font-weight: 600; background: transparent; color: var(--muted); border: 1px solid var(--line);
}
.chip .ic { width: 14px; height: 14px; stroke-width: 2.5; }
.chip.good { background: var(--accent-bg); color: var(--accent); }
.chip.info { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.icon-tile {
  width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent-bg); color: var(--accent);
}
.icon-tile .ic { width: 22px; height: 22px; }
.icon-tile.plain { background: var(--surface-raised); color: var(--muted); }
.icon-tile.small { width: 34px; height: 34px; border-radius: 10px; }
.icon-tile.small .ic { width: 18px; height: 18px; }

/* step 1 */
.hero { display: grid; place-items: center; padding: 6px 0 0; }
.art { width: 100%; height: auto; display: block; }
.hero .art { max-width: 540px; }
.status-row { display: flex; gap: 14px; align-items: center; }
.status-row b { font-size: 15px; }
details.help { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style-position: inside; }
details.help ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
details.help b { color: var(--ink); }
details.help a { color: var(--accent); font-weight: 600; }

/* step 2 */
.board-card { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: center; }
.board-card .how { margin-top: 12px; }
.board-card h2 { font-size: 19px; }
.board-card .chips { margin-top: 12px; }
details.more { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--surface); }
details.more summary { color: var(--ink); display: flex; gap: 8px; align-items: center; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "Show"; margin-left: auto; color: var(--accent); font-size: 13px; }
details.more[open] summary::after { content: "Hide"; }
details.more[open] summary { margin-bottom: 12px; }
dl.facts { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; font-size: 13.5px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-family: var(--mono); font-size: 13px; }
.boards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.board {
  font: inherit; color: inherit; text-align: left; padding: 12px; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px;
}
.board[aria-checked=true] { border-color: var(--accent); background: var(--accent-bg); }
.board[aria-disabled=true] { cursor: not-allowed; color: var(--faint); }
.board .thumb { height: 86px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; }
.board .thumb svg { height: 64px; width: auto; }
.board small { color: var(--muted); font-size: 12.5px; }

/* step 3 */
.part { padding: 0; overflow: hidden; }
.part-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 18px 20px; }
.part-head h2 { font-size: 16px; }
.part-pick { padding: 0 20px 18px; }
.part-body { border-top: 1px solid var(--line); background: var(--soft); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.part.later { box-shadow: none; background: transparent; border-style: dashed; }
.part.later h2 { color: var(--muted); }
.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.choice {
  font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 12px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
}
.choice:hover { border-color: var(--line-strong); }
.choice[aria-checked=true] { border-color: var(--accent); background: var(--accent-bg); }
.choice[aria-checked=true] b { color: var(--accent); }
.choice .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: block; margin-bottom: 8px; background: var(--surface); }
.choice[aria-checked=true] .dot { border: 5px solid var(--accent); }
.choice b { display: block; font-weight: 600; }
.choice small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.switch {
  width: 46px; height: 26px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; position: relative;
  background: var(--line-strong);
}
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); }
.switch[aria-checked=true] { background: var(--accent); }
.switch[aria-checked=true]::after { left: 23px; background: var(--button-ink); }
.wiring { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.wiring svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.wiring svg text { font-family: var(--mono); }
.pin rect.body { stroke: var(--line-strong); stroke-width: 1; }
.pin.p3 rect.body { fill: var(--accent-bg); }
.pin.p3 text { fill: var(--accent); font-weight: 700; }
.pin.p5 rect.body { fill: var(--amber-bg); }
.pin.p5 text { fill: var(--amber); font-weight: 700; }
.pin.gnd rect.body { fill: var(--surface-raised); }
.pin.gnd text { fill: var(--ink); }
.pin.io rect.body { fill: var(--surface); }
.pin.io text { fill: var(--muted); }
.pin.reserved { opacity: .45; }
.pin.pickable { cursor: pointer; }
.pin.pickable rect.body { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 2; fill: var(--accent-bg); }
.pin.pickable text { fill: var(--accent); font-weight: 700; }
.pin.pickable:hover rect.body, .pin.pickable:focus rect.body { fill: var(--accent); stroke-dasharray: none; }
.pin.pickable:hover text, .pin.pickable:focus text { fill: var(--button-ink); }
.pin:focus { outline: none; }
.pin-caption { min-height: 20px; font-size: 13px; color: var(--muted); margin-top: -6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); font-weight: 600; }
.sw { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; background: var(--line-strong); }
.sw.none { background: transparent; border-top: 2px dashed var(--line-strong); height: 0; }
.pin-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
table.wires { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.wires th { text-align: left; font-weight: 650; color: var(--muted); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px 8px; }
table.wires td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
table.wires td.mono { font-size: 13px; }

/* step 4 */
.summary { padding: 6px 22px; }
.sum-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
.sum-row:first-child { border-top: 0; }
.sum-row .k { color: var(--muted); font-size: 13px; }
.sum-row .v { font-weight: 600; }
.timeline { list-style: none; padding: 4px 22px; }
.timeline li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.tl-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 650; background: var(--surface-raised); color: var(--muted); }
.timeline .time { color: var(--faint); font-size: 13px; }
.option-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.option-card:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.option-card input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.option-card small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.overall { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.overall b { font-size: 26px; font-weight: 650; letter-spacing: -0.3px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-raised); overflow: hidden; margin-top: 6px; }
.bar.big { height: 12px; margin: 0 0 18px; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
ol.job { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
ol.job li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
ol.job .mark { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
ol.job .mark .ic { width: 14px; height: 14px; stroke-width: 3; }
ol.job .done .mark { background: var(--accent); border-color: var(--accent); color: var(--button-ink); }
ol.job .running .mark { border-color: var(--accent); }
ol.job .running .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
ol.job .waiting b { color: var(--muted); font-weight: 500; }
ol.job small { font-size: 12.5px; }

/* step 5 */
.success { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: center; }
.big-check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--button-ink); display: grid; place-items: center; }
.big-check .ic { width: 30px; height: 30px; stroke-width: 3; }
.success .lead { margin-top: 4px; }
ol.todo { margin-top: 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.test { display: flex; flex-direction: column; gap: 12px; }
.test-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* advanced tools */
.rail-title { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 10px; margin-bottom: -10px; }
.panel-pick { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.panel-pick small { display: block; color: var(--muted); font-size: 12px; }
.tool-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.tool {
  width: 100%; font: inherit; font-weight: 550; color: var(--muted); display: flex; gap: 10px; align-items: center;
  padding: 9px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left;
}
.tool:hover { background: var(--surface); color: var(--ink); }
.tool.on { background: var(--accent-bg); color: var(--accent); }
.console-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.qc { font: 12.5px var(--mono); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.log {
  margin: 0; height: 300px; overflow: auto; padding: 12px 14px; border-radius: 12px;
  background: var(--panel-frame); color: #d9e4e3; border: 1px solid var(--panel-edge); font: 12.5px/1.55 var(--mono); white-space: pre-wrap;
}
.log .you { color: #94eff0; }
.log .w { color: #f0cf8f; }
.send { display: flex; gap: 8px; margin-top: 10px; }
.send input { flex: 1; font: 13px var(--mono); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.list-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row small { display: block; color: var(--muted); font-size: 12.5px; }

/* connected parts: placements, layouts, pin check */
.tag { display: inline-flex; align-items: center; font-size: 12px; line-height: 1.4; font-weight: 600; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
.tag.ok { color: var(--accent); background: var(--accent-bg); }
.tag.plan { color: var(--amber); border: 1px solid var(--line); }
.places { display: flex; flex-direction: column; gap: 8px; }
.place, .layout {
  font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.place { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: start; }
.place:hover, .layout:hover { border-color: var(--line-strong); }
.place[aria-checked=true], .layout[aria-checked=true] { border-color: var(--accent); background: var(--accent-bg); }
.place[aria-checked=true] b, .layout[aria-checked=true] b { color: var(--accent); }
.place[aria-disabled=true], .layout[aria-disabled=true], .choice[aria-disabled=true] { cursor: not-allowed; opacity: .62; }
.place .dot { width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); }
.place[aria-checked=true] .dot { border: 5px solid var(--accent); }
.place b, .layout b { display: block; font-weight: 600; }
.place small, .layout small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.place small.why, .layout small.why, .choice small.why { color: var(--red); }
.layouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.layout { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.wiring-block { display: flex; flex-direction: column; gap: 6px; }
.note.bad { background: var(--red-bg); color: var(--red); }
ul.tight { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.pincheck { display: flex; flex-direction: column; gap: 14px; }
.pc-row { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; }
.pc-row small { display: block; color: var(--muted); font-size: 13px; }
.pin.taken rect.body { fill: var(--surface-raised); stroke-dasharray: 2 2; }
.pin.taken text { fill: var(--faint); }

@media (max-width: 900px) {
  .rail { width: 220px; }
  .page, .actions { padding-left: 24px; padding-right: 24px; }
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board-card { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .shell { flex-direction: column; }
  .rail { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .rail-foot, .step small { display: none; }
  .steps { flex-direction: row; overflow-x: auto; }
  .step b { display: none; }
  .page, .actions { padding-left: 16px; padding-right: 16px; }
  .boards, .layouts { grid-template-columns: 1fr; }
}
</style>
</head>

/* The wiring pictures are drawn from the connector tables, so each is the pin map, not a
 * drawing of it. Wires run in lanes (between J7's rows, above J13's) in an order where no wire
 * crosses another or a pin it doesn't end on: VCC must never look as if it lands on 5V. */
function findPin(label, rows = J7) {
  for (let r = 0; r < rows.length; r++) {
    const c = rows[r].indexOf(label);
    if (c >= 0) return [r, c];
  }
  return [rows.length - 1, 0];
}
function pinTip(label, n, mine, taken, reserved, pickable, opt) {
  if (mine) return `${label}: the ${opt.short}’s ${mine.pin}.`;
  if (taken) return `${label}: taken by ${taken}.`;
  if (reserved) return WHY[n] || `${label}: not offered for this part.`;
  if (label === '5V') return '5V: never for these parts.';
  if (label === '3V3') return '3V3: power for these parts.';
  if (label === 'GND') return 'GND: ground.';
  if (label === 'SCL' || label === 'SDA') return `${label}: the connector’s ${label} line.`;
  if (pickable) return `${label}: free. Click to put DATA here.`;
  return J7_TERMINALS.includes(n) ? `${label}: a wired-zone terminal, free.` : `${label}: free.`;
}
function wiring(conn, wires, opt) {
  const P = 31, W = 26, H = 23, LS = 12, x0 = 250;
  const two = conn.rows.length === 2;
  const top = two ? 96 : opt.kind === 'clock' ? 36 : 84;
  const X = (c) => x0 + c * P;
  const list = wires.map((w) => ({ ...w, rc: Array.isArray(w.to) ? w.to : findPin(w.to, conn.rows) }));
  // Top-row pins take the upper lanes from the left, bottom-row pins the rest from the right.
  const order = two
    ? [...list.filter((w) => w.rc[0] === 0).sort((a, b) => a.rc[1] - b.rc[1]),
      ...list.filter((w) => w.rc[0] === 1).sort((a, b) => b.rc[1] - a.rc[1])]
    : [...list].sort((a, b) => b.rc[1] - a.rc[1]);
  const n = order.length;
  const lane = (i) => (two ? top + H / 2 + 13 + i * LS : top + i * LS);
  const rowY = two ? [top, lane(n - 1) + 13 + H / 2] : [lane(n - 1) + 13 + H / 2];
  const cols = conn.rows[0].length;
  const bx = X(0) - W / 2 - 10, by = rowY[0] - H / 2 - 9;
  const bw = (cols - 1) * P + W + 20, bh = rowY[rowY.length - 1] - rowY[0] + H + 18;
  const mid = (lane(0) + lane(n - 1)) / 2;
  const mTop = Math.min(lane(0) - 24, mid - 36), mBot = Math.max(lane(n - 1) + 24, mid + 36);
  const titleY = two ? by - 10 : by + bh + 18;
  const width = Math.max(bx + bw, bx + conn.title.length * 6.6) + 8, height = Math.max(two ? by + bh : titleY, mBot) + 12;
  let s = `<svg viewBox="0 0 ${width} ${height}" width="${Math.round(width * 1.2)}" height="${Math.round(height * 1.2)}" role="img" aria-label="${opt.label}">`;
  if (opt.kind !== 'clock') {
    const pts = [`44,${mTop}`];
    for (let k = 1; k <= 7; k++) pts.push(`${44 + (k % 2 ? -8 : 8)},${mTop - k * 6}`);
    pts.push(`44,${mTop - 48}`);
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--faint)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  s += `<rect x="24" y="${mTop}" width="130" height="${mBot - mTop}" rx="7" fill="var(--pcb)"/>`;
  s += opt.kind === 'clock'
    ? `<circle cx="58" cy="${mid - 8}" r="17" fill="#c5cbcf" stroke="#8d989e" stroke-width="1.5"/>`
    : `<rect x="38" y="${mTop + 14}" width="34" height="26" rx="3" fill="rgb(0 0 0 / 28%)"/>`;
  s += `<text x="34" y="${mBot - 10}" font-size="10.5" fill="var(--pcb-ink)" font-weight="700">${opt.name}</text>`;
  order.forEach((w, i) => {
    s += `<rect x="154" y="${lane(i) - 5}" width="12" height="10" rx="1.5" fill="var(--pad)"/>`;
    s += `<text x="146" y="${lane(i) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--pcb-ink)" font-weight="700">${w.pin}</text>`;
  });
  s += `<text x="${bx}" y="${titleY}" font-size="11.5" fill="var(--muted)" font-family="var(--font)" font-weight="600">${conn.title}</text>`;
  s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="9" fill="var(--surface-raised)" stroke="var(--line)"/>`;
  conn.rows.forEach((row, r) => row.forEach((label, c) => {
    const pn = label.startsWith('IO') ? Number(label.slice(2)) : null;
    const mine = order.find((w) => w.rc[0] === r && w.rc[1] === c);
    const taken = pn !== null && !mine && opt.taken ? opt.taken[label] || '' : '';
    const reserved = pn !== null && !mine && !taken && (opt.reserved || []).includes(pn);
    const pickable = !!opt.pick && pn !== null && opt.pick.includes(pn) && pn !== opt.current && !taken;
    let cls = label === '3V3' ? 'p3' : label === '5V' ? 'p5' : label === 'GND' ? 'gnd' : 'io';
    if (taken) cls += ' taken';
    if (reserved) cls += ' reserved';
    if (pickable) cls += ' pickable';
    const tip = pinTip(label, pn, mine, taken, reserved, pickable, opt);
    const attrs = pickable ? ` role="button" tabindex="0" data-act="pin" data-pin="${pn}" aria-label="Put DATA on J7 IO${pn}"` : '';

    `<div class="card">
      <div class="overall"><b>${pct} %</b><span class="muted">About ${running() ? '1 minute' : '4 minutes'} left</span></div>
      <div class="bar big" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <ol class="job">${rows.map(([t, st, p, d]) => `<li class="${st}"><span class="mark">${st === 'done' ? icon('check') : ''}</span>
        <div><b>${t}</b>${st === 'running' ? `<div class="bar" role="progressbar" aria-label="${t}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div><small class="muted">${d}</small>` : ''}</div></li>`).join('')}</ol>
    </div>
    <p class="small muted">The words change at most once a second, and nothing on this screen moves by itself.</p>`;
}

function testRf() {
  const where = S.rf === 'module' ? (S.rfPlace === 'j7' ? `Receiver module on J7 IO${S.rfPin}` : 'Receiver module on the socket’s pad IO10')
    : S.rf === 'cc1101' ? `CC1101 on ${S.ccPlace === 'j7' ? 'J7' : 'the radio socket'}, its registers read back right`
      : 'Receiver found on the radio socket';
  return `<section class="card test">
    <div class="test-head"><span class="icon-tile">${icon('radio')}</span>
      <div><h2>Wireless sensors</h2><p class="muted small">${where} · 12 noise edges a second, a quiet spot</p></div>
      <span class="chip good">${icon('check')}Working</span></div>
    <p><b>Press a button on a remote, or open a door sensor near the panel.</b> Each one appears below as the panel hears it.</p>
    <table class="wires"><thead><tr><th>Heard</th><th>Kind</th><th>Codes</th><th>Last</th></tr></thead><tbody>
      <tr><td><b>5A3F1</b></td><td>EV1527</td><td class="mono">0A × 3</td><td>just now</td></tr>
      <tr><td><b>0B7C2</b></td><td>EV1527</td><td class="mono">02 × 1</td><td>12 s ago</td></tr>
    </tbody></table>
    <p class="small muted">To use one as a zone: on the panel, Zones › Add a zone › 433 MHz sensor.</p>
  </section>`;
}
function testClock() {
  const where = S.clockPlace === 'j7' ? 'On J7 IO27 and IO28' : 'On the I2C connector';
  return `<section class="card test">
    <div class="test-head"><span class="icon-tile">${icon('clock')}</span>
      <div><h2>Battery-backed clock</h2><p class="muted small">${where} · found when the panel started · 23.5 °C</p></div>
      <span class="chip good">${icon('check')}Working</span></div>
    <p>The panel’s clock matches this computer to the second.</p>
    <div class="row-actions"><button class="btn small" data-act="noop">Set it from this computer</button></div>
  </section>`;
}
function testZigbee() {
  return `<section class="card test"><div class="test-head"><span class="icon-tile plain">${icon('tower')}</span>
    <div><h2>Zigbee radio</h2><p class="muted small">In the socket · this RoboAlarms doesn’t use it yet</p></div>
    <span class="chip">Later</span></div></section>`;
}

function pTest() {
  const none = S.skipParts || (S.rf === 'none' && !S.clock && !S.zigbee);
  return `<p class="eyebrow">Step 5 of 5</p>
    <div class="success"><span class="big-check">${icon('check')}</span>
      <div><h1 id="page-title" tabindex="-1">${running() ? 'Updated: RoboAlarms 0.6.0 is running' : 'RoboAlarms is running on your panel'}</h1>
      <p class="lead">${running() ? 'Its codes, zones and Wi-Fi came through unchanged.' : 'Finish on the touchscreen, then test your parts here.'}</p></div></div>` +
    (running() ? '' : `<div class="card"><h2>On the panel’s touchscreen</h2><ol class="todo">
      <li>Join your Wi-Fi.</li>
      <li>Change the two factory codes when it asks (installer 69420, master 123456).</li></ol></div>`) +
    '<h2 class="section">Test your parts</h2>' +
    (none ? `<p class="muted">${S.skipParts ? 'You chose to set the parts up later' : 'No extra parts were chosen'}. Add them any time: Advanced tools › Hardware.</p>`
      : (S.rf !== 'none' ? testRf() : '') + (S.clock ? testClock() : '') + (S.zigbee ? testZigbee() : ''));
}

function actions() {
  const back = S.step > 0 && S.step < 4 && !S.installing
    ? `<button class="btn ghost" data-act="back">${icon('left')}Back</button>` : '';
  let right = '';
  if (S.step === 0) {
    right = `<button class="btn primary" data-act="next"${S.scenario === 'none' ? ' disabled' : ''}>${running() ? 'Next: check the panel' : 'Next: check the panel'}${icon('right')}</button>`;
  } else if (S.step === 1) {
    right = !running() && !S.checked
      ? `<button class="btn primary" data-act="identify">${icon('search')}Check this panel</button>`
      : `<button class="btn primary" data-act="next">Next: connected parts${icon('right')}</button>`;
  } else if (S.step === 2) {
    const blocked = conflicts().length > 0;
    right = `${blocked ? '<span class="small muted">Fix what the pin check marks to continue.</span>' : ''}
      <button class="btn ghost" data-act="skip">Skip for now</button>
      <button class="btn primary" data-act="next"${blocked ? ' disabled' : ''}>Next: review${icon('right')}</button>`;
  } else if (S.step === 3) {
    right = S.installing
      ? `<button class="btn" data-act="noop">${icon('x')}Stop…</button>`
      : `<button class="btn primary" data-act="install">${icon('download')}${running() ? 'Update to 0.6.0' : 'Install RoboAlarms 0.6.0'}</button>`;
  } else {
    right = `<button class="btn" data-act="mode" data-mode="tools">${icon('terminal')}Advanced tools</button>
      <button class="btn primary" data-act="restart">Finish</button>`;
  }
  return `${back}<span class="spacer"></span>${right}`;
}

function guided() {
  const page = [pConnect, pCheck, pParts, pInstall, pTest][S.step]();
  return `<nav class="rail" aria-label="Setup steps">${rail()}</nav>
    <main class="content"><div class="page"><div class="inner">${page}</div></div>
    <footer class="actions">${actions()}</footer></main>`;
}

/* ---- advanced tools ------------------------------------------------------------------- */
const TOOLS = [['ports', 'usb', 'Panels and ports'], ['console', 'terminal', 'Console'], ['hardware', 'wrench', 'Hardware'],
  ['backups', 'archive', 'Backups'], ['software', 'download', 'Software'], ['logs', 'folder', 'Logs']];

function listRows(rows) {
  return `<div class="card" style="padding:4px 22px">${rows.map(([ic, t, d, btn]) =>
    `<div class="list-row"><span class="icon-tile small plain">${icon(ic)}</span><div><b>${t}</b><small>${d}</small></div>${btn ? `<button class="btn small" data-act="noop">${btn}</button>` : '<span></span>'}</div>`).join('')}</div>`;
}

function toolPage() {
  const T = (t, lead) => `<h1 id="page-title" tabindex="-1">${t}</h1><p class="lead">${lead}</p>`;
  switch (S.tool) {
    case 'ports':
      return T('Panels and ports', 'Everything plugged into this computer, for when there is more than one board.') + listRows([
        ['cpu', 'CrowPanel Advanced 7″ · COM5', 'RoboAlarms 0.6.0 · idle · CH340K 1A86:7523', 'Open'],
        ['cpu', 'ESP32-S3 board · COM8', 'No RoboAlarms software for this chip yet · CP210x 10C4:EA60', ''],
        ['usb', 'COM1 · built-in serial port', 'Not a USB device', ''],
        ['usb', 'COM4 · Bluetooth link', 'Not a USB device', '']]);
    case 'hardware':
      return T('Hardware', 'Every setting of the parts wired to the panel, and the tools to check them.') + listRows([
        ['radio', 'Receiver: module on J7 IO3', 'rf module ook · rf pin 3 · 12 edges a second, line 3 % high', 'Change'],
        ['radio', 'Record 3 seconds of raw pulses', 'Saved to Documents › RoboAlarms › Captures, for the decoder’s tests', 'Record'],
        ['clock', 'Battery-backed clock: working', 'DS3231 at 0x68 · 0 s from this computer · 23.5 °C', 'Set time'],
        ['sliders', 'All pin assignments', 'The board description, what uses each pin and why the rest are reserved', 'Show']]);
    case 'backups':
      return T('Backups', 'Whole-flash copies taken before an install. The only way back to the maker’s demo.') + listRows([
        ['archive', 'crowpanel_p4-30eda0123450-2026-09-24.bin', '16 MB · this panel · checksum verified', 'Restore…'],
        ['folder', 'Documents › RoboAlarms › Backups', 'Open the folder', 'Open'],
        ['download', 'Back up this panel now', 'About 4 minutes; the panel restarts into its loader', 'Back up']]);
    case 'software':
      return T('Software', 'Which RoboAlarms build goes on the panel, and the choices a guided setup makes for you.') + listRows([
        ['download', 'RoboAlarms 0.6.0 · built in', 'Builds for P4 silicon v1.x and v3.x · signed with the project’s key', ''],
        ['folder', 'Open another firmware file…', 'A .roboflash bundle; it is checked before anything is written', 'Open'],
        ['cpu', 'Choose the build by hand', 'Overrides detection; a build for other silicon asks first', 'Choose'],
        ['triangle', 'Install fresh', 'Erases codes, users, zones, Wi-Fi and history', 'Install…']]);
    case 'logs':
      return T('Logs', 'What the Flasher did: every command, every write, and how it recognised each board.') + listRows([
        ['folder', 'Open the log folder', 'AppData › Local › RoboAlarms › Flasher › logs', 'Open']]);
    default:
      return T('Console', 'The panel’s service console. Connecting doesn’t restart the panel, and keypad codes are never typed here.') +
        `<div class="card">
          <div class="console-bar">${['status', 'health', 'rf', 'rtc', 'zones', 'power', 'help'].map((c) => `<button class="qc" data-act="noop">${c}</button>`).join('')}
            <span class="spacer"></span><button class="btn small" data-act="noop">Save log</button><button class="btn small" data-act="noop">Restart panel…</button></div>
          <pre class="log"><span class="you">&gt; status</span>
alarm: disarmed, ready  partition 1  zones open 0
power: mains ok  battery 13.4 V
<span class="you">&gt; rf</span>
rf: receiver module on GPIO 3  edges/s 12  high 3 %
rf: heard EV1527 5A3F1 code 0A (3)
<span class="w">W (812345) wifi: beacon timeout, reconnecting</span></pre>
          <div class="send"><input type="text" placeholder="Type a command, e.g. status" aria-label="Console command"><button class="btn primary small" data-act="noop">Send</button></div>
        </div>`;
  }
}

function tools() {
  return `<nav class="rail" aria-label="Advanced tools">
      <p class="rail-title">Advanced tools</p>
      <div class="panel-pick"><span class="icon-tile small">${icon('cpu')}</span><div><b>CrowPanel 7″</b><small>COM5 · RoboAlarms ${S.step === 4 || running() ? '0.6.0' : 'not installed'}</small></div></div>
      <ul class="tool-list">${TOOLS.map(([k, ic, t]) => `<li><button class="tool${S.tool === k ? ' on' : ''}" data-act="tool" data-v="${k}"${S.tool === k ? ' aria-current="page"' : ''}>${icon(ic)}${t}</button></li>`).join('')}</ul>
      <div class="rail-foot"><button class="link small" data-act="mode" data-mode="guided">${icon('left')}Back to guided setup</button></div>
    </nav>
    <main class="content"><div class="page"><div class="inner wide">${toolPage()}</div></div></main>`;
}

/* ---- rendering and events ------------------------------------------------------------- */
function render(moved) {
  document.getElementById('mode-guided').setAttribute('aria-pressed', String(S.mode === 'guided'));
  document.getElementById('mode-tools').setAttribute('aria-pressed', String(S.mode === 'tools'));
  document.getElementById('scenario').value = S.scenario;
  document.getElementById('firmware').value = S.future ? 'future' : 'today';
  document.getElementById('proto-finish').hidden = !(S.mode === 'guided' && S.installing);
  const app = document.getElementById('app');
  const old = app.querySelector('.page');
  const keep = old ? old.scrollTop : 0;
  const a = document.activeElement;
  const focusKey = a && a.dataset ? [a.dataset.act, a.dataset.v, a.dataset.pin].join('|') : '';
  app.innerHTML = S.mode === 'guided' ? guided() : tools();
  if (!moved) {
    const page = app.querySelector('.page');
    if (page) page.scrollTop = keep;
    // Keep the keyboard where it was: the same control, redrawn.
    const same = [...app.querySelectorAll('[data-act]')].find((el) =>
      [el.dataset.act, el.dataset.v, el.dataset.pin].join('|') === focusKey);
    if (same && focusKey !== '||') same.focus({ preventScroll: true });
  } else {
    const h = document.getElementById('page-title');
    if (h) h.focus({ preventScroll: true });
    const page = app.querySelector('.page');
    if (page) page.scrollTop = 0;
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const act = t.dataset.act;
  let moved = true;
  switch (act) {
    case 'next': if (S.step === 2) S.skipParts = false; S.step = Math.min(4, S.step + 1); S.picking = false; break;
    case 'back': S.step = Math.max(0, S.step - 1); S.picking = false; break;
    case 'goto': S.step = Number(t.dataset.step); S.picking = false; break;
    case 'skip': S.skipParts = true; S.step = 3; S.picking = false; break;
    case 'identify': S.checked = true; break;
    case 'pickboard': S.pickBoard = !S.pickBoard; moved = false; break;
    case 'rf': S.rf = t.dataset.v; S.picking = false; moved = false; break;
    case 'picking': S.picking = !S.picking; moved = false; break;
    case 'pin': S.rfPin = Number(t.dataset.pin); S.picking = false; moved = false; break;
    case 'clock': S.clock = !S.clock; moved = false; break;
    case 'rfplace': S.rfPlace = t.dataset.v; S.picking = false; moved = false; break;
    case 'ccplace': S.ccPlace = t.dataset.v; moved = false; break;
    case 'clockplace': S.clockPlace = t.dataset.v; moved = false; break;
    case 'zigbee': S.zigbee = !S.zigbee; moved = false; break;
    case 'layout': Object.assign(S, LAYOUTS.find((l) => l.key === t.dataset.v).set); S.picking = false; moved = false; break;
    case 'install': S.installing = true; break;
    case 'finish-install': S.installing = false; S.step = 4; break;
    case 'restart': resetFlow(); break;
    case 'mode': S.mode = t.dataset.mode; break;
    case 'tool': S.tool = t.dataset.v; break;
    case 'backup': return;
    default: e.preventDefault(); return;
  }
  e.preventDefault();
  render(moved);
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.act === 'backup') { S.backup = e.target.checked; render(false); }
});
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.dataset && d.dataset.key) S.open[d.dataset.key] = d.open;
}, true);
document.addEventListener('keydown', (e) => {
  const t = e.target.closest && e.target.closest('g.pin[role=button]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
function showTip(e) {
  const box = e.target.closest && e.target.closest('.wiring-block');
  if (!box) return;
  const cap = box.querySelector('.pin-caption');
  const g = e.target.closest('g.pin');
  cap.textContent = g ? g.dataset.tip : cap.dataset.default;
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.getElementById('scenario').addEventListener('change', (e) => { S.scenario = e.target.value; resetFlow(); render(true); });
document.getElementById('firmware').addEventListener('change', (e) => { S.future = e.target.value === 'future'; render(false); });

/* The website's theme toggle: this prototype starts from the computer's setting and does not
 * remember a choice (the real Flasher would keep it in its settings). */
const themeButton = document.getElementById('theme-toggle');
function syncTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  themeButton.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
  themeButton.title = themeButton.getAttribute('aria-label');
}
themeButton.addEventListener('click', () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  syncTheme();
});
syncTheme();

render(false);
</script>
</body>
</html>
