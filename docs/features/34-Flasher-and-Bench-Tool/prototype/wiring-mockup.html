<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flasher wiring mockup</title>
<meta name="description" content="Mockup for BL-117 (docs/features/34): a guided wiring flow in the Flasher for someone with no electronics background, before the panel is plugged in. Nothing here talks to a board.">
<link rel="icon" href="../../../../tools/flasher/roboflash/web/logo.png">
<!-- The Flasher's own stylesheet, so the mockup looks as the app does and follows it. -->
<link rel="stylesheet" href="../../../../tools/flasher/roboflash/web/app.css">
<script>try { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
<!-- Mockup for docs/features/34 "Wiring before the panel is plugged in" (BL-117). One file with
     the app's CSS linked; the J7 drawing is web/app.js's wiring() copied, with one wire
     highlighted and pin picking, and wiringAll() draws every part at once. Pins and places are
     the CrowPanel 7"'s from tools/flasher/roboflash/boards.json. No motion (FLS-017). Purple is
     the mockup's own: its bar and notes, never the app. -->
<style>
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 20px; background: #2e2750; color: #ece9fb; font-size: 12.5px; }
.mk-bar > b { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #c9bfff; }
.mk-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.mk-group > span { color: #a99ee0; margin-right: 4px; }
.mk-bar button { font: inherit; font-size: 12.5px; color: #ece9fb; background: transparent; border: 1px solid #5b4f96; border-radius: 5px; padding: 3px 9px; cursor: pointer; }
.mk-bar button:hover { border-color: #c9bfff; }
.mk-bar button[aria-pressed=true] { background: #ece9fb; color: #2e2750; border-color: #ece9fb; font-weight: 600; }
.mk-note { border: 1.5px dashed #7c5cd6; background: rgb(124 92 214 / 7%); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink); }
.mk-note::before { content: "Mockup note"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7c5cd6; margin-bottom: 2px; }
:root[data-theme=dark] .mk-note { border-color: #a58cf0; }
:root[data-theme=dark] .mk-note::before { color: #b9a6ff; }

/* the rail in three parts */
.rail-group { display: flex; flex-direction: column; gap: 14px; }
.step.skip b { color: var(--faint); font-weight: 500; }
.step.skip .num { border-style: dashed; }

/* overview */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.flow span { display: flex; flex-direction: column; justify-content: center; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
.flow span small { font-size: 11.5px; font-weight: 500; }
.flow span.hl { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.flow span.bad { background: var(--red-bg); color: var(--red); border-color: transparent; }
.flow i { align-self: center; color: var(--faint); font-style: normal; }
.flow b.phase { align-self: center; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 2px 0 8px; }
.flow b.phase:first-child { margin-left: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.mini p { font-size: 13.5px; color: var(--muted); }

/* step 1: panel and parts */
.board-pick { display: grid; grid-template-columns: 16px 150px 1fr; gap: 18px; align-items: center; padding: 14px 18px; text-align: left; width: 100%; }
.pcard { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; }
.pcard.on { border-color: var(--accent); }
.pcard.wide { grid-column: 1 / -1; }
.pcard.off { border-style: dashed; background: transparent; }
.pcard-head { font: inherit; color: inherit; text-align: left; background: none; border: 0; cursor: pointer; display: grid; grid-template-columns: 22px 44px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 12px; }
.pcard-head:disabled { cursor: not-allowed; opacity: .6; }
.pcard-head b { display: block; font-weight: 650; }
.pcard-head small { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
.tick { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; margin-top: 12px; color: var(--button-ink); }
.tick .ic { width: 14px; height: 14px; stroke-width: 3; }
.pcard.on .tick { background: var(--accent); border-color: var(--accent); }
.subpick { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--soft); border-radius: 0 0 12px 12px; }
.subpick .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* step 2: places */
.conn { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.conn svg { width: 100%; height: auto; max-height: 62px; display: block; }
.conn p { font-size: 13.5px; color: var(--muted); }
.conn .chips { gap: 6px; }
.conn.wide { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px 20px; align-items: center; }
.conn.wide > b, .conn.wide > p, .conn.wide > .chips { grid-column: 1; }
.conn.wide > svg { grid-column: 2; grid-row: 1 / span 4; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--accent-bg); color: var(--accent); margin-left: 8px; vertical-align: 2px; }
.pros { color: var(--accent) !important; }
.cons { color: var(--amber) !important; }
dl.gloss { display: grid; grid-template-columns: 110px 1fr; gap: 8px 16px; font-size: 14px; margin-top: 4px; }
dl.gloss dt { font-weight: 700; font-family: var(--mono); font-size: 13.5px; }
dl.gloss dd { margin: 0; color: var(--muted); }

/* get ready */
.need { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.need li { border-top: 1px solid var(--line); }
.need li:first-child { border-top: 0; }
.need label { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: start; padding: 11px 0; cursor: pointer; }
.need input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.need small { display: block; color: var(--muted); font-size: 13px; }
.need li.danger { border-top: 0; margin-bottom: 6px; }
.need li.danger + li { border-top: 0; }
/* The warning is in the frame (a red border and bar, the red icon), the words stay in the text
 * colour: red words on a red tint were hard to read (2026-09-30). */
.need li.danger label { padding: 12px 14px 12px 12px; border: 1.5px solid var(--red); border-left-width: 6px; border-radius: 8px; background: var(--surface-raised); }
.need li.danger b { color: var(--ink); }
.need li.danger small { color: var(--ink); }
.need li.danger .ic { width: 20px; height: 20px; margin-top: 1px; color: var(--red); }
.sheet li.danger { border-left: 4px solid var(--red); padding-left: 8px; }
.need svg { width: 120px; height: auto; }

/* the wiring steps */
.wire-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.wire-top .grow { flex: 1; min-width: 200px; }
.wire-top .bar { margin-top: 6px; }
.parts-seg { flex-wrap: wrap; }
.parts-seg .cnt { font-weight: 500; opacity: .8; margin-left: 2px; }
.now { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; font-size: 14.5px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.now ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.now .muted { font-size: 13.5px; }
.wiring.big svg { width: 100%; height: auto; }
.wiring .dim { opacity: .14; }
.wiring .wire.focus { stroke-width: 5; }
.pin.target rect.body { stroke: var(--ink); stroke-width: 2; }
.wl { list-style: none; margin: 0; padding: 4px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.wl li { display: grid; grid-template-columns: 20px 26px 1fr auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.wl li + li { box-shadow: inset 0 1px 0 var(--line); }
.wl li.focus { background: var(--accent-bg); box-shadow: none; }
.wl li.focus + li { box-shadow: none; }
.wl li.done b { color: var(--muted); font-weight: 600; }
.wl input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.wl .sw { margin: 0; width: 26px; }
.wl .wl-ic { color: var(--faint); display: grid; place-items: center; }
.wl small { display: block; color: var(--muted); font-size: 12.5px; }
.wl .here { font-size: 12px; font-weight: 650; color: var(--accent); }
details.more ol, details.more ul { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.howto { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: center; }
.howto svg { width: 100%; height: auto; }
.wiring .badge { fill: var(--accent); }
.wiring .loupe { pointer-events: none; }
.wiring svg.loupe-on { cursor: none; }
.wiring .loupe-bg { fill: var(--surface); }
.wiring .loupe-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.wiring svg.all .pin.used text { font-weight: 750; }
.wiring svg.all .pin.io:not(.used) text { fill: var(--faint); }
.wiring .hdr-title.hdr-big { font-size: 13px; }
.wiring text.badge-t { fill: var(--button-ink); font-family: var(--font); font-weight: 750; }
.wiring .part[data-act] { cursor: pointer; }
.wiring .pinbadge[data-act]:focus-visible .badge { stroke: var(--ink); stroke-width: 2; }
.num-badge { display: inline-grid; place-items: center; min-width: 19px; height: 19px; border-radius: 50%; background: var(--accent); color: var(--button-ink); font-size: 11.5px; font-weight: 750; margin-right: 7px; vertical-align: 1px; }
.seg .seg-sep { width: 1px; align-self: stretch; margin: 5px 3px; background: var(--line-strong); }
.zb .mod { fill: #1b2225; stroke: var(--line-strong); stroke-width: 1.5; }
.zb .leg { fill: #c9a227; }
.zb .usb { fill: #a7b0b4; }
.zb .btn-dot { fill: #cfd5d8; }
.zb .soc { fill: #0b1012; }
.zb .lead { fill: none; stroke: #5b6468; stroke-width: 3; stroke-linecap: round; }
.zb .housing { fill: #15191b; stroke: var(--line-strong); }
.zb .hole { fill: #3a4448; }
.zb .cap { fill: var(--muted); font: 11px var(--font); }
.zb .lbl { fill: var(--muted); font: 9px var(--mono); }
.zb .arrow { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.zb .arrow-t { fill: var(--accent); font: 600 11px var(--font); }
.ticks > .bar { margin: 12px 0 2px; }
.tick-part { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.tick-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.more ul.ticklist { list-style: none; margin: 0; padding: 4px; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ticklist li + li { box-shadow: inset 0 1px 0 var(--line); }
.ticklist label { display: grid; grid-template-columns: 20px 26px 1fr; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.ticklist label:hover { background: var(--accent-bg); }
.ticklist input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.ticklist .sw { margin: 0; width: 26px; }
.ticklist .wl-ic { color: var(--faint); display: grid; place-items: center; }
.ticklist small { display: block; color: var(--muted); font-size: 12.5px; }
.ticklist li.done b { color: var(--muted); }
ol.plug-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.fullmap { display: flex; flex-direction: column; gap: 10px; }
.fm-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dimcard { opacity: .35; }
.sock-part { display: flex; flex-direction: column; gap: 6px; }
.sock-part + .sock-part { border-top: 1px solid var(--line); padding-top: 12px; }

/* the printed sheet: paper is light in either theme */
.sheet { --ink: #142b30; --muted: #536970; --faint: #7a8e92; --line: #d3dfdd; --line-strong: #b9cac7; --surface: #ffffff; --surface-raised: #edf3f2; --soft: #f4f8f7;
  --accent: #007b7d; --accent-bg: #e0f3ef; --amber: #865914; --amber-bg: #fbf1de; --pcb: #2b6e4a; --pcb-ink: #e3f5ea; --pad: #c9a227;
  --wire-vcc: #d9480f; --wire-gnd: #142b30; --wire-data: #1c6fd6; --wire-sig: #7b4fc9; --wire-y: #c99400; --wire-g: #2b8a3e; --wire-p: #c2255c; --red: #b3261e; --red-bg: #fdecea;
  color-scheme: light; background: #fff; color: var(--ink); width: 100%; max-width: 794px; margin: 0 auto; padding: 36px 40px; border: 1px solid var(--line); border-radius: 4px;
  display: flex; flex-direction: column; gap: 18px; font-size: 13.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.sheet-head b { display: block; font-size: 20px; letter-spacing: -.02em; }
.sheet-warn { border: 1.5px solid var(--amber); background: var(--amber-bg); color: #5c3d0c; border-radius: 6px; padding: 10px 12px; }
.sheet-part { display: flex; flex-direction: column; gap: 10px; break-inside: avoid; }
.sheet-part h2 { font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.sheet .wiring { border-radius: 6px; }
.sheet table.wires td { padding: 6px 8px; }
.sheet ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.box { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.sheet-foot { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); }

@media print {
  @page { size: A4; margin: 12mm; }
  html, body { height: auto; background: #fff; }
  body { display: block; }
  .mk-bar, .appbar, .rail, .actions, .no-print { display: none !important; }
  .shell, .content { display: block; }
  .page { padding: 0; overflow: visible; }
  .inner { max-width: none; }
  .sheet { border: 0; padding: 0; max-width: none; }
}
@media (max-width: 900px) { .grid2, .grid3, .subpick .choices { grid-template-columns: 1fr; } .board-pick { grid-template-columns: 16px 1fr; } .board-pick svg { display: none; } .howto { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="mk-bar" id="mk-bar"></div>
<header class="appbar">
  <div class="wordmark"><img src="../../../../tools/flasher/roboflash/web/logo.png" alt=""><b>RoboAlarms</b><span>Flasher</span></div>
  <div class="seg" role="group" aria-label="Mode">
    <button type="button" aria-pressed="true">Guided setup</button>
    <button type="button" aria-pressed="false">Advanced tools</button>
  </div>
  <button class="icon-btn" id="theme-toggle" type="button" data-act="theme" aria-label="Switch theme" title="Switch theme"></button>
</header>
<div id="app" class="shell"></div>
<script>
'use strict';

/* ---- helpers, as in web/app.js ------------------------------------------------------------ */
function h(tag, attrs, ...kids) { const el = document.createElement(tag); setAttrs(el, attrs); append(el, kids); return el; }
const SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids) { const el = document.createElementNS(SVGNS, tag); setAttrs(el, attrs); append(el, kids); return el; }
function setAttrs(el, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;

}

}
const $ = (id) => document.getElementById(id);

const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');

/* Lucide icons (ISC): the app's, plus printer, unplug, power, list-checks, moon, package,
 * shield-check and hand. */
const ICONS = {

  power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',

/* ---- step 4: check before power ------------------------------------------------------------ */
function pCheck() {
  const gs = assembly(groups(M.choice));

function pConnect() {

}

/* ---- the printed sheet --------------------------------------------------------------------- */
function pPrint() {
  const gs = assembly(groups(M.choice));
  const sheet = h('article', { class: 'sheet' },
    h('header', { class: 'sheet-head' }, h('div', {}, h('b', { text: 'Wiring sheet' }), h('span', { class: 'muted', text: BOARD.long })),
      h('span', { class: 'muted', text: 'RoboAlarms Flasher · 29 September 2026' })),
    h('div', { class: 'sheet-warn' }, h('b', { text: 'Before you start: ' }), 'POWER switch off and every cable out. Every VCC goes to 3V3, never 5V. Match the labels printed on the board and on each part, not the wire colours.'),
    gs.length ? [

      h('section', { class: 'sheet-part' }, h('h2', { text: 'Before you switch it on' }), h('ul', {}, CHECKS.map(([, t, why, danger]) => h('li', { class: danger ? 'danger' : null }, h('span', { class: 'box' }), danger ? h('b', { text: t }) : t, why ? ' ' + why : '')))),
    ] : h('p', { text: 'No extra parts chosen: nothing to wire.' }),

      h('div', { class: 'row-actions' }, btn([icon('printer'), 'Print or save as PDF'], 'print', '', 'primary'), btn([icon('left'), 'Back'], 'go', M.back, ''))),
    sheet,
  ], null, true);
}

/* ---- overview ------------------------------------------------------------------------------ */
function strip(steps) {
  return h('div', { class: 'flow' }, steps.map((x, i) => typeof x === 'string'
    ? h('b', { class: 'phase', text: x })
    : [i && typeof steps[i - 1] !== 'string' ? h('i', { text: '›' }) : null, h('span', { class: x[1] || '' }, x[0], x[2] ? h('small', { text: x[2] }) : null)]));
}
function pOverview() {
  const mini = (ic, t, d, go) => h('div', { class: 'card mini' }, h('span', { class: 'icon-tile small' }, icon(ic)), h('b', { text: t }), h('p', { text: d }), go ? h('div', {}, btn('See it', 'go', go, 'small')) : null);
  return frame(null, [
    h('p', { class: 'eyebrow', text: 'Mockup · BL-117' }),
    h('h1', { text: 'Guided wiring, before the panel is plugged in' }),
    h('p', { class: 'lead', text: 'For someone with no electronics background: from "what have I got" to a wired, checked panel ready to install, without the panel plugged in until the end.' }),
    h('section', { class: 'card mini' }, h('b', { text: 'Today' }),

      h('p', { text: 'The wiring shows only once the panel is found, so it is plugged in and on while you look at it; unplugging it to wire starts the setup again. It also assumes you know what a header or 3V3 is.' })),
    h('section', { class: 'card mini' }, h('b', { text: 'Proposed' }),
      strip(['Plan', ['Panel and parts', 'hl'], 'Wire', ['Get ready', 'hl'], ['Full wiring', 'hl'], ['Check before power', 'hl'], 'Install', ['Connect'], ['Check the panel'], ['Install'], ['Test and finish']]),
      h('p', { text: 'Plan and Wire need no panel. Nothing extra to connect? Plan goes straight to Install. Unplugging the panel later never loses your place.' }),
      h('div', {}, btn(['Walk through it', icon('right')], 'go', 'parts', 'small primary'))),

    h('div', { class: 'grid3' },
      mini('radio', 'Parts, not places', 'Step 1: pick the panel, then tick what you have. Nothing about pins.', 'parts'),
      mini('plug', 'Places picked for you', 'The Flasher puts each part in the best place for the others: no pin questions for a beginner. Advanced, folded on step 1: choose yourself.', 'places'),
      mini('package', 'Get ready', 'Step 2: what you need (how many jumper wires, the coin cell, the antenna), where the places are on your panel, the words you\'ll see, how to fit a jumper wire.', 'ready'),
      mini('listChecks', 'Wire from the pictures', 'Step 3: every part numbered in the order to fit it, and a tick list of every wire in words.', 'full'),
      mini('shield', 'Check before power', 'Step 4: no wire on 5V, one wire per pin, nothing touching: checks to tick if they help.', 'check'),
      mini('printer', 'Print or save', 'One sheet: what you need, the full wiring, each part\'s wires to tick, and the checks.', 'print')),
    mk('Found while drawing this: today each part\'s drawing chooses its own power pins, so a receiver and a clock both on J7 are both drawn on 3V3 pin 1. Here every wire gets a pin of its own.'),
    h('h2', { class: 'section', text: 'Tell me' }),

      h('li', { text: 'Eight steps in three parts: right?' }),

      h('li', { text: 'What would a first-timer still get stuck on?' })),
  ], null, true);
}

/* ---- the mockup's bar, rendering and events ----------------------------------------------- */
function mkBar() {
  const b = (v, t) => h('button', { type: 'button', 'data-act': 'go', 'data-v': v, 'aria-pressed': String(M.screen === v) }, t);
  const barEl = clear($('mk-bar'));
  barEl.append(h('b', { text: 'Mockup · BL-117' }),
    h('div', { class: 'mk-group' }, b('overview', 'Overview')),
    h('div', { class: 'mk-group' }, h('span', { text: 'Plan:' }), b('parts', '1 Panel and parts'), b('places', 'Advanced: places')),
    h('div', { class: 'mk-group' }, h('span', { text: 'Wire:' }), b('ready', '2 Get ready'), b('full', '3 Full wiring'), b('check', '4 Check')),
    h('div', { class: 'mk-group' }, h('span', { text: 'Install:' }), b('connect', '5 Connect')),
    h('div', { class: 'mk-group' }, b('print', 'Print sheet')));
}
const SCREENS = { overview: pOverview, parts: pParts, places: pPlaces, ready: pReady, full: pFull, check: pCheck, connect: pConnect, print: pPrint };
function render(moved) {
  const old = $('page');
  const keep = old ? old.scrollTop : 0;
  mkBar();
  const app = clear($('app'));
  append(app, [SCREENS[M.screen]()]);
  const page = $('page');
  if (page) page.scrollTop = moved ? 0 : keep;
  const dark = document.documentElement.dataset.theme === 'dark';
  clear($('theme-toggle')).append(icon(dark ? 'sun' : 'moon'));
  try { history.replaceState(null, '', '#' + M.screen); } catch (e) { /* file: */ }
}
function go(v) {
  if (!SCREENS[v]) return;
  if (v === 'print' && M.screen !== 'print') M.back = M.screen;
  M.screen = v;
  render(true);
}
/* Parts are ticked on step 1 without places; a new part gets its recommended place, and the
 * others keep theirs unless that no longer fits. */
function setParts(c) {
  const kept = Object.assign({}, c);
  const rec = recommend(c);
  for (const [on, place] of [[c.rf !== 'none' && M.choice.rf === c.rf, 'rf_place'], [c.clock && M.choice.clock, 'clock_place'], [c.zwave && M.choice.zwave, 'zwave_place']]) {
    kept[place] = on ? M.choice[place] : rec[place];
  }
  M.choice = problems(kept).length ? rec : kept;
  M.tab = 0;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true' || t.tagName === 'INPUT') return;
  const v = t.dataset.v;
  const c = Object.assign({}, M.choice);
  M.moved = {};
  switch (t.dataset.act) {
    case 'go': go(v); return;
    case 'theme': document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; break;
    case 'part':
      if (v === 'rf') c.rf = c.rf === 'none' ? 'cc1101' : 'none';
      else c[v] = !c[v];
      setParts(c); break;
    case 'rfkind': c.rf = v; setParts(c); break;
    case 'rfplace': M.choice.rf_place = v; M.tab = 0; break;
    case 'clockplace':
      M.choice.clock_place = v;
      M.tab = 0;
      if (v === 'j7' && M.choice.zwave && M.choice.zwave_place === 'j7') { M.choice.zwave_place = 'socket'; M.moved.zwave = 'Moved to the radio socket: the clock now uses J7 IO27 and IO28.'; }
      break;
    case 'zwplace':
      M.choice.zwave_place = v;
      M.tab = 0;
      if (v === 'j7' && M.choice.clock && M.choice.clock_place === 'j7') { M.choice.clock_place = 'j13'; M.moved.clock = 'Moved to the I2C connector (J13): the Z-Wave radio now uses J7 IO27 and IO28.'; }
      break;
    case 'pin': M.choice.rf_pin = Number(v); break;
    case 'recommend': M.choice = recommend(M.choice); M.tab = 0; break;
    case 'fullfocus': M.fullFocus = t.tagName === 'g' && M.fullFocus === v ? '' : v; break;
    case 'checkfocus': M.checkFocus = t.tagName === 'g' && M.checkFocus === v ? '' : v; break;
    case 'print': window.print(); return;
    default: return;
  }
  render(false);
});
document.addEventListener('keydown', (e) => {
  const t = e.target.closest && e.target.closest('svg g[role=button]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  switch (t.dataset.act) {
    case 'tick': M.tick[t.dataset.v] = t.checked; break;
    case 'ready': M.ready[t.dataset.v] = t.checked; break;
    case 'check': M.checks[t.dataset.v] = t.checked; break;
    default: return;
  }
  render(false);
});
/* A fold-out stays as the person left it when the page is drawn again. */
document.addEventListener('toggle', (e) => { const k = e.target.dataset && e.target.dataset.key; if (k) M.open[k] = e.target.open; }, true);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (SCREENS[v] && v !== M.screen) go(v); });
M.screen = SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
render(true);
</script>
