<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview mockup · Panel Manager</title>
<style>
/*@PANEL_CSS@*/

/* ================= MOCKUP ONLY: the proposed pages' own styles ================= */
.mock-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px;
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 12px, var(--surface) 12px 24px);
  border-bottom: 2px dashed var(--line-strong); font-size: 12.5px; }
.mock-bar strong { letter-spacing: 1px; text-transform: uppercase; font-size: 11px; color: var(--faint); }
.mock-bar .filters { margin: 0; }
nav a .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700;
  display: inline-grid; place-items: center; background: var(--warn-soft); color: var(--warn); }

/* The command card: one per partition */
.command { padding: 22px; display: flex; flex-direction: column; gap: 18px; container-type: inline-size; }
.command-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.state-badge { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  border: 3px solid currentColor; background: var(--good-soft); color: var(--good); }
.state-badge svg.icon { width: 30px; height: 30px; }
.command.warn .state-badge { background: var(--warn-soft); color: var(--warn); }
.command.info .state-badge { background: var(--info-soft); color: var(--info); }
.command.bad .state-badge { background: var(--bad-soft); color: var(--bad); }
/* During an alarm the card itself turns red, as the touchscreen's does (color_alarm_bg and a red
 * border); the button stays the green Disarm, so it stands out against the red. */
.command.bad { border-color: var(--bad); border-width: 2px; background: color-mix(in srgb, var(--bad) 9%, var(--surface)); }
.command.bad .facts > div { background: var(--surface); }

/* The sensors that tripped, in order: what a person needs first when more than one went off */
.sequence { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.sequence-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.sequence-head strong { color: var(--ink); }
.sequence ol { list-style: none; margin: 0; padding: 0; }
.sequence li { display: grid; grid-template-columns: 26px 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.sequence li:last-child { border-bottom: 0; }
.sequence .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); }
.sequence .z { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--bad);
  background: color-mix(in srgb, var(--bad) 14%, transparent); }
.sequence .z svg.icon { width: 21px; height: 21px; stroke-width: 2; }
.sequence .main strong { display: block; font-size: 15px; }
.sequence .main span { display: block; font-size: 13px; color: var(--muted); }
.sequence .main span.tag { display: inline-flex; margin-left: 8px; vertical-align: 2px; font-size: 11.5px; color: var(--bad); }
.sequence .when { text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; white-space: nowrap; }
.sequence .when small { display: block; color: var(--muted); font-size: 12px; }
.sequence li.first { background: color-mix(in srgb, var(--bad) 6%, transparent); }
.state-words { flex: 1; min-width: 220px; }
.state-words .part-name { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
.state-words .state { display: block; font-size: 28px; font-weight: 650; letter-spacing: -0.4px; line-height: 1.2; }
.command.good .state { color: var(--good); } .command.warn .state { color: var(--warn); }
.command.info .state { color: var(--info); } .command.bad .state { color: var(--bad); }
.state-words p { margin-top: 4px; }
.countdown { font-variant-numeric: tabular-nums; }
.count { font-size: 40px; font-weight: 650; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
.command.info .count { color: var(--info); } .command.warn .count { color: var(--warn); }
.summary { font-size: 13px; color: var(--muted); }
.show-all { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; color: var(--info); font-size: 13px; }
.since { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.5; }
.since strong { display: block; color: var(--ink); font-weight: 600; }

/* Facts about the armed state, in a strip */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts > div { background: var(--surface-2); padding: 11px 14px; min-width: 0; }
.facts span { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--faint); }
.facts strong { display: block; font-size: 14.5px; margin-top: 3px; overflow-wrap: anywhere; }
.facts small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

/* Exit / entry time left: a steady bar that moves once a second (no animation) */
.timebar { display: flex; flex-direction: column; gap: 6px; }
.timebar .bar { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.timebar .bar > i { display: block; height: 100%; background: var(--info); }
.command.warn .timebar .bar > i { background: var(--warn); }
.timebar .ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }

/* Big choices: arming levels, and the one thing to do when armed */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choices.one { grid-template-columns: minmax(0, 1fr); }
button.choice { justify-content: flex-start; text-align: left; gap: 14px; min-height: 78px; padding: 14px 16px;
  border-radius: 12px; background: var(--surface-2); border-color: var(--line); }
button.choice:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface-2); }
/* The arming tiles' chips, as the touchscreen draws them (layouts/1024x600 icon_chip + arm_tile):
 * the level's tone at 16 % behind the icon in the full tone, a bigger icon with a 2 px line.
 * Dark: the panel's own tones (globals.xml color_rose / color_blue / color_violet). Light: the
 * same hues, darker, so the icon still stands 3:1 or more off its chip on white. */
:root { --tone-away: #e11d48; --tone-stay: #2563eb; --tone-night: #7c3aed; --tint: 12%; }
:root[data-theme="dark"] { --tone-away: #fb7185; --tone-stay: #60a5fa; --tone-night: #a78bfa; --tint: 16%; }
.choice .glyph { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.choice .glyph svg.icon { width: 27px; height: 27px; stroke-width: 2; }
.choice.away .glyph { color: var(--tone-away); background: color-mix(in srgb, var(--tone-away) var(--tint), transparent); }
.choice.stay .glyph { color: var(--tone-stay); background: color-mix(in srgb, var(--tone-stay) var(--tint), transparent); }
.choice.night .glyph { color: var(--tone-night); background: color-mix(in srgb, var(--tone-night) var(--tint), transparent); }
.choice.neutral .glyph { color: var(--tone-stay); background: color-mix(in srgb, var(--tone-stay) var(--tint), transparent); }
.choice .chev { color: var(--faint); width: 22px; height: 22px; }
.choice strong { display: block; font-size: 16px; }
.choice small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
/* The one thing to do while armed, in an alarm or after one: the same tile as Away / Stay / Night,
 * with a green chip (the panel's color_green in the dark; darker on white, >= 3:1 off its chip). */
/* One solid button per card, the touchscreen's confirm key: the tone with dark ink in the dark theme
 * (7:1 or more), a darker tone with white ink on white (4.5:1 or more). */
:root { --fill-away: #e11d48; --fill-stay: #2563eb; --fill-night: #7c3aed; --fill-go: #047857; --on-fill: #ffffff; }
:root[data-theme="dark"] { --fill-away: #fb7185; --fill-stay: #60a5fa; --fill-night: #a78bfa; --fill-go: #34d399; --on-fill: #0b0f14; }
button.choice.fill { color: var(--on-fill); min-height: 72px; }
button.choice.fill.away { background: var(--fill-away); border-color: var(--fill-away); }
button.choice.fill.stay { background: var(--fill-stay); border-color: var(--fill-stay); }
button.choice.fill.night { background: var(--fill-night); border-color: var(--fill-night); }
button.choice.fill.go { background: var(--fill-go); border-color: var(--fill-go); }
button.choice.fill:hover:not(:disabled) { filter: brightness(1.06); }
button.choice.fill .glyph { background: color-mix(in srgb, var(--on-fill) 14%, transparent); color: var(--on-fill); }
button.choice.fill strong { font-size: 17px; }
button.choice.fill .chev { color: inherit; opacity: 0.8; }
/* Cancel arming: quiet, outlined */
button.choice.neutral { background: transparent; border-color: var(--line-strong); }
button.choice.neutral .glyph { background: var(--surface-2); color: var(--muted); }
/* The step's switches take the level's tone when on (no fifth colour) */
.sheet.away input.switch:checked { background: var(--fill-away); }
.sheet.stay input.switch:checked { background: var(--fill-stay); }
.sheet.night input.switch:checked { background: var(--fill-night); }
.choice .chev { margin-left: auto; }

@container (max-width: 600px) { .choices:not(.one) .choice .chev { display: none; } }

.command-options { display: flex; gap: 10px 28px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.command-options label { display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
.command-options .note { margin-left: auto; font-size: 12.5px; color: var(--muted); }

/* Arming, one level at a time: what it watches, the options that level has, then the button */
.sheet { display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--surface); }
.sheet-head { display: flex; gap: 14px; align-items: flex-start; }
.sheet-head .glyph { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.sheet-head .glyph svg.icon { width: 27px; height: 27px; stroke-width: 2; }
.sheet.away .sheet-head .glyph { color: var(--tone-away); background: color-mix(in srgb, var(--tone-away) var(--tint), transparent); }
.sheet.stay .sheet-head .glyph { color: var(--tone-stay); background: color-mix(in srgb, var(--tone-stay) var(--tint), transparent); }
.sheet.night .sheet-head .glyph { color: var(--tone-night); background: color-mix(in srgb, var(--tone-night) var(--tint), transparent); }
.sheet-head h3 { font-size: 20px; }
.sheet-head p { font-size: 13.5px; margin-top: 3px; }
.sheet-head .main { flex: 1; min-width: 0; }
.sheet .notice { margin: 0; }
.sheet .facts > div { background: var(--surface-2); }
.opts { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.opts-head { padding: 10px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
label.opt { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
label.opt:last-child { border-bottom: 0; }
label.opt .main { flex: 1; min-width: 0; }
label.opt strong { display: block; font-size: 14.5px; }
label.opt small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
/* Arm: the level's own tile again (its chip carries the level's tone); not yet possible: muted */
button.choice.fill:disabled { opacity: 1; background: var(--surface); border-color: var(--line-strong); color: var(--muted); filter: none; }
button.choice.fill:disabled .glyph { background: var(--surface-2); color: var(--muted); }
.sheet .foot-note { font-size: 12.5px; color: var(--muted); }
/* A level that isn't ready says why, in amber, on its own tile */
.choice.blocked small { color: var(--warn); }

/* The confirmation: the safe choice is the one already focused */
button.confirm { background: var(--fill-go); border-color: var(--fill-go); color: var(--on-fill); }
button.confirm:hover:not(:disabled) { background: var(--fill-go); filter: brightness(1.06); }
.consequences { list-style: none; margin: 8px 0 4px; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
.consequences li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.consequences li:last-child { border-bottom: 0; }
.consequences .icon { margin-top: 1px; color: var(--muted); }
.consequences li.warn .icon { color: var(--warn); }

/* Zones that stop arming, inside the card */
.blockers { border: 1px solid var(--line); border-radius: 12px; }
.blockers .list > li { padding: 10px 16px; }
.blockers-head { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* At a glance */
a.tile { text-decoration: none; color: inherit; position: relative; }
a.tile:hover { border-color: var(--line-strong); }
a.tile .go-to { position: absolute; right: 14px; top: 14px; color: var(--faint); }
.tile.good .tile-value { color: var(--good); } .tile.warn .tile-value { color: var(--warn); }
.tile.bad .tile-value { color: var(--bad); }

/* Zones page */
.zone-grid > .card + .card { margin-top: 0; }
.zone-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.zone-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.zone-card .glyph { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--good-soft); color: var(--good); }
.zone-card.warn .glyph { background: var(--warn-soft); color: var(--warn); }
.zone-card.bad .glyph { background: var(--bad-soft); color: var(--bad); }
.zone-card.info .glyph { background: var(--info-soft); color: var(--info); }
.zone-card.muted .glyph { background: var(--surface-2); color: var(--muted); }
.zone-card .main { flex: 1; min-width: 0; }
.zone-card .main strong { display: block; }
.zone-card .main span { display: block; font-size: 13px; color: var(--muted); }
.zone-card.warn .main .now { color: var(--warn); } .zone-card.bad .main .now { color: var(--bad); }
.zone-card.info .main .now { color: var(--info); }
.explain { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
.explain + .explain { border-top: 1px solid var(--line); }
.explain .glyph { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: var(--warn-soft); color: var(--warn); }
.explain.bad .glyph { background: var(--bad-soft); color: var(--bad); }
.explain.info .glyph { background: var(--info-soft); color: var(--info); }
.explain .main { flex: 1; min-width: 0; }
.explain h3 { font-size: 15.5px; }
.explain p { font-size: 13.5px; margin-top: 4px; }
.explain .what { margin-top: 8px; font-size: 13.5px; color: var(--ink); }
.explain .what b { color: var(--muted); font-weight: 600; }
.explain .actions { margin-top: 10px; }
.explain .side { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.legend { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 18px; padding: 16px 22px; font-size: 13.5px; align-items: baseline; }
.legend dd { margin: 0; color: var(--muted); }
.checks-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.checks-list > div { display: flex; gap: 10px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.checks-list .ok { color: var(--good); } .checks-list .bad { color: var(--warn); }
.checks-list strong { display: block; font-size: 14px; } .checks-list span { display: block; font-size: 12.5px; color: var(--muted); }
details.more > summary { cursor: pointer; padding: 14px 22px; font-weight: 600; list-style: none; }
details.more > summary::before { content: "+ "; color: var(--muted); }
details.more[open] > summary::before { content: "− "; }

@container (max-width: 600px) {
  .since { text-align: left; flex-basis: 100%; padding-left: 86px; margin-top: -10px; }
  .choices:not(.one) button.choice { flex-direction: column; justify-content: center; text-align: center; gap: 8px; min-height: 96px; padding: 12px 8px; }
  .choices:not(.one) .choice small { display: none; }
  .command-options .note { margin-left: 0; flex-basis: 100%; }
}
@media (max-width: 1100px) { .checks-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .command { padding: 18px 16px; }
  .zone-grid, .checks-list { grid-template-columns: minmax(0, 1fr); }
  .explain .side { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Panel Manager">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><img width="34" height="34" alt="" src="/*@BRAND@*/"></span><span><span>RoboAlarms</span><small>Panel Manager</small></span></div>
    <div class="panel-card"><strong>Home</strong><span>192.0.2.10 · 30eda0123456</span></div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="account"><span>Alex · System master</span><button type="button" class="link">Change password</button><button type="button" class="link">Sign out</button></div>
  </aside>
  <div class="workspace">
    <div class="mock-bar">
      <strong>Mockup</strong>
      <div class="filters" role="group" aria-label="State" id="states"></div>
      <strong>Power</strong><div class="filters" role="group" aria-label="Power" id="powers"></div>
      <strong>Connection</strong><div class="filters" role="group" aria-label="Connection" id="nets"></div>
      <strong>Theme</strong><div class="filters" role="group" aria-label="Theme" id="themes"></div>
    </div>
    <header class="topbar"><span class="topbar-title" id="crumb">Overview</span><span class="connection">Connected</span></header>
    <main id="main"></main>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<script>
'use strict';
const ICONS = /*@ICONS@*/;
Object.assign(ICONS, {
  away: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  shieldCheck: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
  shieldAlert: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="M12 8v4M12 16h.01"/>',
  lockOpen: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-1"/>',
  bypass: '<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>',
  siren: '<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14v-3H5zM12 3v1M4.2 6.2l.7.7M19.8 6.2l-.7.7M2 12h1M21 12h1"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18M14 12h.01"/>',
  window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M12 4v16"/>',
  motion: '<circle cx="13" cy="4" r="2"/><path d="m7 21 3-6 3 2v5M10 15l1-6 4 3 3-1M11 9 7 10l-1 3"/>',
  smoke: '<path d="M4 5h16l-2 4H6z"/><path d="M8 13v2M12 13v5M16 13v2"/>',
  co: '<path d="M17.5 19H7a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 11a4 4 0 0 1-1.5 8Z"/>',
  water: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/>',
  glass: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="m9 3 2 6-3 3 4 9M20 9l-6 2"/>',
  garage: '<path d="M3 21V9l9-6 9 6v12M7 21v-9h10v9M7 15h10M7 18h10"/>',
  battery: '<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M7 10v4"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  // The status bar's own battery pictures (Lucide battery-full / -medium / -low / -charging), and a plug
  batFull: '<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 11v2M10 11v2M14 11v2"/>',
  batMedium: '<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 11v2M10 11v2"/>',
  batLow: '<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 11v2"/>',
  batCharging: '<path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1M22 11v2"/><path d="m11 7-3 5h4l-3 5"/>',
  plugOff: '<path d="M9 2v6M15 2v4M6 8h6M18 12a6 6 0 0 1-8.5 5.4M6 12V8M12 18v4M2 2l20 20"/>',
  wifiOff: '<path d="M2 8.5a15 15 0 0 1 4.2-2.8M9.8 4.6A15 15 0 0 1 22 8.5M5 12a10 10 0 0 1 4.1-2.4M15.3 10A10 10 0 0 1 19 12M8.5 15.5a5 5 0 0 1 7 0M2 2l20 20"/><circle cx="12" cy="19" r="1"/>',
});
const icon = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

        return `<div class="explain ${kind === 'bad' ? 'bad' : kind === 'info' ? 'info' : ''}"><span class="glyph">${icon(z[2])}</span>
          <div class="main"><h3>${z[1]} · ${word}</h3><p>${means}</p>
          ${bypassBtn(z) && ['open', 'active', 'bypassed'].includes(zoneState(z[0])) ? `<div class="actions">${bypassBtn(z)}</div>` : ''}</div>
          <span class="side">${sideFor(z)}</span></div>`; }).join('')}</div></section>` : ''}
    <section class="section"><div class="section-head"><h2>All zones</h2>
      <div class="filters" role="group" aria-label="Show">${filters.map(([v, l]) => `<button type="button" data-zfilter="${v}" aria-pressed="${v === zoneFilter}">${l}</button>`).join('')}</div></div>
      <div class="zone-grid">${shown.map(z => { const [word, kind] = MEANS[zoneState(z[0])];
        return `<div class="card zone-card ${kind === 'good' ? '' : kind}"><span class="glyph">${icon(z[2])}</span>
          <div class="main"><strong>${z[1]}</strong><span class="now">${word}</span><span>Zone ${z[0]}</span></div>${bypassBtn(z)}</div>`; }).join('') || '<p class="muted">No zones of this kind.</p>'}</div>
      ${disarmed ? '' : '<p class="gap muted"><small>Bypass while disarmed.</small></p>'}</section>
    <section class="section"><div class="card"><details class="more"><summary>What these words mean</summary>
      <dl class="legend">${Object.values(MEANS).map(([w, k, m]) => `<dt>${`<span class="tag ${k}">${w}</span>`}</dt><dd>${m}</dd>`).join('')}</dl></details></div></section>`;
}

// ---------------------------------------------------------------- Troubles
const TROUBLES = {
  clock: ['Clock not set', 'clock', 'Connect Wi-Fi so the clock can sync', 'Date and time', 'Since 10:38 PM', 'time'],
  power: ['Mains power lost', 'plugOff', 'Running on battery', 'Power', 'Since 9:58 PM', 'health'],
  network: ['Network down', 'wifiOff', 'Wi-Fi is disconnected', 'Network', 'Since 10:20 PM', 'network'],
};
function watches() {
  const cut = ['cut', 'low'].includes(POWER);
  return [['Mains power', cut ? 'Out' : 'On', cut],
    ['Backup battery', {full: 'Full', charging: 'Charging · 64%', cut: '82% left', low: '9% left', none: 'Not fitted'}[POWER], POWER === 'low'],
    ['Network', NET === 'down' ? 'Wi-Fi down' : NET === 'weak' ? 'Weak signal' : 'Connected', NET === 'down'],
    ['Reports', NET === 'down' ? 'Waiting' : 'Getting through', false],
    ['Clock', S.troubles.includes('clock') ? 'Not set' : 'Set', S.troubles.includes('clock')], ['Wireless sensors', 'All heard', false],
    ['Siren', 'Working', false], ['Storage', 'Saving', false], ['Panel cover', 'Closed', false]];
}
function troublesPage() {
  const n = troubleCount();
  const items = [...panelTroubles().map(k => { const [title, g, line, link, since, to] = TROUBLES[k]; return {title, g, line, link, since, to}; }),
    ...troubleZones().map(z => ({title: `${z[1]} · ${MEANS[zoneState(z[0])][0]}`, g: 'batLow', line: 'Check the sensor', link: 'Zone', since: S.when[z[0]] || '', to: 'zones'}))];
  return `<div class="page-head"><div><h1>Troubles</h1><p>${n ? `${n} active` : 'Nothing to fix'}</p></div>
      ${n ? `<div class="actions"><button type="button" id="ack" title="Stops the trouble beeps">${icon('check')}Acknowledge</button></div>` : ''}</div>
    ${n ? `<div class="card">${items.map(x => `<div class="explain"><span class="glyph">${icon(x.g)}</span>
        <div class="main"><h3>${x.title}</h3><p>${x.line}</p></div>
        <span class="side">${x.since}</span><button type="button" class="small" data-page="${x.to}">${x.link}${icon('chev')}</button></div>`).join('')}</div>`
      : `<div class="notice good">${icon('check')}<div><strong>No troubles</strong></div></div>`}
    <section class="section"><div class="section-head"><h2>What the panel watches</h2></div>
      <div class="card checks-list">${watches().map(([label, now, bad]) =>
        `<div>${icon(bad ? 'alert' : 'check', bad ? 'bad' : 'ok')}<div><strong>${label}</strong><span>${now}</span></div></div>`).join('')}</div></section>`;
}

// ---------------------------------------------------------------- pages that already exist (stand-ins)
const EXISTING = {network: ['Network', 'wifi', 'The Network page you have today (Wi-Fi, signal, IP address, the connection check). The Connection tile opens it for anyone who may change the network: the system master, a partition master, the installer. For a standard user the tile opens System health instead.'],
  health: ['System health', 'heart', 'The System health page you have today, with its Power card (battery, charge, charging). The Power tile opens it.'],
  time: ['Date and time', 'clock', 'The Date and time page you have today.']};
function existingPage(id) {
  const [title, g, words] = EXISTING[id];
  return `<div class="page-head"><div><h1>${title}</h1></div></div>
    <div class="notice info">${icon(g)}<div><strong>Existing page, not part of this mockup</strong><p>${words}</p>
    <div class="actions"><button type="button" class="small" data-page="overview">${icon('back')}Back to the Overview</button></div></div></div>`;
}

// ---------------------------------------------------------------- render + events
function render() {
  nav();
  $('#crumb').textContent = {overview: 'Overview', zones: 'Zones', troubles: 'Troubles'}[page] || EXISTING[page]?.[0] || 'Overview';
  $('#main').innerHTML = page === 'zones' ? zonesPage() : page === 'troubles' ? troublesPage() : EXISTING[page] ? existingPage(page) : overview();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-show-all],[data-do-disarm],[data-dialog-close],[data-page],[data-arm],[data-go-arm],[data-sheet-close],[data-disarm],[data-clear],[data-bypass],[data-unbypass],[data-zfilter],#ack');
  if (!el) return;
  e.preventDefault();
  const d = el.dataset;
  if (d.page !== undefined) { if (['overview', 'zones', 'troubles'].includes(d.page) || EXISTING[d.page]) { page = d.page; window.scrollTo(0, 0); } }
  else if (d.arm) { S.sheet = {p: Number(d.p), level: d.arm, instant: false, silent: false, bypass: false}; }
  else if (d.sheetClose !== undefined) { S.sheet = null; }
  else if (d.goArm) { const o = S.sheet, total = EXIT_S * (o.level === 'away' && o.silent ? 2 : 1);
    if (o.bypass) blockers(o.level).forEach(z => { S.zone[z[0]] = 'bypassed'; });
    S.instant = o.instant;
    Object.assign(S.parts[o.p], {state: 'exit', level: o.level, silent: o.level === 'away' && o.silent, left: total, total, last: ['Armed by Alex', 'just now']});
    S.sheet = null; startTimer(); }
  else if (d.disarm && S.parts[Number(d.disarm)].state === 'armed') { confirmDisarm(Number(d.disarm)); return; }
  else if (d.dialogClose !== undefined) { $('#dialog').close(); return; }
  else if (d.doDisarm || d.disarm) { if ($('#dialog').open) $('#dialog').close(); const p = S.parts[Number(d.doDisarm || d.disarm)];
    if (p.state === 'alarm') { Object.assign(p, {state: 'memory', last: ['Disarmed by Alex', 'just now']}); S.pending = []; }
    else { Object.assign(p, {state: 'disarmed', last: ['Disarmed by Alex', 'just now']}); }
    Object.keys(S.zone).forEach(k => { if (S.zone[k] === 'bypassed' || S.zone[k] === 'alarm') S.zone[k] = 'normal'; }); }
  else if (d.showAll !== undefined) { S.showAll = true; }
  else if (d.clear) { Object.assign(S.parts[Number(d.clear)], {state: 'disarmed'}); S.seq = null; }
  else if (d.bypass) { S.zone[d.bypass] = 'bypassed'; }
  else if (d.unbypass) { S.zone[d.unbypass] = 'normal'; }
  else if (d.zfilter) { zoneFilter = d.zfilter; }
  else if (el.id === 'ack') { el.disabled = true; return; }
  render();
});
document.addEventListener('change', e => { const c = e.target.closest('[data-opt]'); if (c) S[c.dataset.opt] = c.checked;
  const o = e.target.closest('[data-sopt]'); if (o && S.sheet) { S.sheet[o.dataset.sopt] = o.checked; render(); } });

// ---------------------------------------------------------------- mockup switches
function pick(k) {
  S = STATES[k][1]();
  $$('#states button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  render();
  if (S.parts.some(p => p.state === 'exit' || p.state === 'entry') || S.pending?.length) startTimer();
}
$('#states').innerHTML = Object.entries(STATES).map(([k, [label]]) => `<button type="button" data-k="${k}">${label}</button>`).join('');
$('#states').onclick = e => { const b = e.target.closest('button'); if (b) pick(b.dataset.k); };
$('#themes').innerHTML = ['dark', 'light'].map(t => `<button type="button" data-t="${t}">${t === 'dark' ? 'Dark' : 'Light'}</button>`).join('');
$('#themes').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.documentElement.dataset.theme = b.dataset.t;
  $$('#themes button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
};
$('#themes [data-t=dark]').setAttribute('aria-pressed', 'true');
function group(id, table, get, set) {
  const el = $('#' + id);
  const draw = () => { el.innerHTML = Object.entries(table).map(([k, [label]]) => `<button type="button" data-v="${k}" aria-pressed="${k === get()}">${label}</button>`).join(''); };
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.v); draw(); render(); };
  draw();
}
group('powers', POWERS, () => POWER, v => { POWER = v; });
group('nets', NETS, () => NET, v => { NET = v; });
pick('ready');
</script>
</body>
</html>
